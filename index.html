<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="词汇生长 Vocabulary Growth — 不背单词，让单词长出来。学(词群语块)→复(分层抢救)→用(造句+当天用掉)。">
  <meta name="theme-color" content="#2E7D32">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>词汇生长 Vocabulary Growth</title>
  <link rel="stylesheet" href="css/style.css?v=1.0.33">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
</head>
<body>
  <div id="app">
    <!-- 顶栏 -->
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand" onclick="VG_APP.go('#today')">
          <span class="brand-logo">🌱</span>
          <div class="brand-text">
            <span class="brand-name">词汇生长</span>
            <span class="brand-sub">Vocabulary Growth</span>
          </div>
        </div>
        <div class="topbar-right">
          <div class="streak-pill" id="streakPill" title="连续学习天数">🔥 <b id="streakDays">0</b> 天</div>
          <div class="streak-pill" id="pointsPill" title="开口积分（练习/徽章可获得）">⭐ <b id="pointsVal">0</b></div>
          <button class="icon-btn" id="darkBtn" onclick="VG_APP.toggleDark()" title="深色模式">🌙</button>
          <button class="icon-btn" id="speedBtn" title="发音语速：点击切换">🐢 慢</button>
        </div>
      </div>
      <!-- 二级子导航（由 JS 动态渲染） -->
      <nav class="sub-nav" id="subNav"></nav>
    </header>

    <!-- 页面容器 -->
    <main id="main"></main>

    <!-- Toast -->
    <div id="toastWrap"></div>

    <!-- 底部导航栏 -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="bn-btn active" data-bt="today" onclick="VG_APP.go('#today')">
        <span class="bn-ic">🌱</span><span class="bn-tx">今日</span>
      </button>
      <button class="bn-btn" data-bt="learn" onclick="VG_APP.go('#learn')">
        <span class="bn-ic">📖</span><span class="bn-tx">学习</span>
        <span class="nav-badge" id="bnBadge" style="display:none"></span>
      </button>
      <button class="bn-btn" data-bt="mine" onclick="VG_APP.go('#library')">
        <span class="bn-ic">👤</span><span class="bn-tx">我的</span>
      </button>
      <button class="bn-btn" data-bt="settings" onclick="VG_APP.go('#settings')">
        <span class="bn-ic">⚙️</span><span class="bn-tx">设置</span>
      </button>
    </nav>

    <footer class="footer">
      <p>🌱 词汇生长 · 数据源自 OB「英语自学建设系统」(Hermes) 真实学习资产 · 学 → 复 → 用</p>
      <p class="footer-tip"><img src="assets/icons/icon-192.png" alt="词汇生长" class="footer-avatar">不背单词，让单词长出来 · 所有数据保存在本机浏览器 · 苏不倦出品</p>
    </footer>

    <!-- 悬浮反馈按钮 -->
    <button class="feedback-float-btn" id="feedbackFloatBtn" onclick="VG_APP.showFeedbackModal()" title="反馈建议" aria-label="反馈建议">💬</button>

    <!-- 反馈弹窗 -->
    <div class="feedback-modal" id="feedbackModal">
      <div class="feedback-modal-content">
        <div class="feedback-modal-header">
          <h3>帮助我们改进</h3>
          <button class="feedback-modal-close" onclick="VG_APP.closeFeedbackModal()">✕</button>
        </div>
        <div class="fb-ip-row">
          <img src="assets/icons/icon-192.png" alt="词汇生长" class="fb-ip-avatar">
          <div class="fb-ip-text">
            <b>苏不倦</b><span>词汇生长作者 · 反馈我一条条看</span>
            <span class="fb-ip-wechat" onclick="VG_APP.copyWechat()">💬 加微信 kz910124（备注：词汇生长）直接发我，响应最快</span>
          </div>
        </div>
        <form id="feedbackForm" onsubmit="VG_APP.submitFeedback(event)">
          <label>反馈类型</label>
          <select name="type" required>
            <option value="">请选择反馈类型</option>
            <option value="bug">问题反馈</option>
            <option value="suggestion">功能建议</option>
            <option value="feature">新功能需求</option>
          </select>

          <label>评分（可选 · 点亮小苏）</label>
          <div class="rate-row" id="starRating">
            <button type="button" class="rate-btn" data-rating="1" onclick="VG_APP.setRating(1)"><img src="assets/icons/icon-192.png" alt="1 分"></button>
            <button type="button" class="rate-btn" data-rating="2" onclick="VG_APP.setRating(2)"><img src="assets/icons/icon-192.png" alt="2 分"></button>
            <button type="button" class="rate-btn" data-rating="3" onclick="VG_APP.setRating(3)"><img src="assets/icons/icon-192.png" alt="3 分"></button>
            <button type="button" class="rate-btn" data-rating="4" onclick="VG_APP.setRating(4)"><img src="assets/icons/icon-192.png" alt="4 分"></button>
            <button type="button" class="rate-btn" data-rating="5" onclick="VG_APP.setRating(5)"><img src="assets/icons/icon-192.png" alt="5 分"></button>
          </div>
          <div class="rate-thanks" id="rateThanks">哎哟，谢谢夸奖！🎉</div>

          <label>反馈内容</label>
          <textarea name="content" rows="4" placeholder="请详细描述您的建议或问题..." required></textarea>

          <label>邮箱（可选，用于回复）</label>
          <input type="email" name="email" placeholder="your@email.com">

          <div class="feedback-modal-actions">
            <button type="submit" class="btn">提交反馈</button>
            <button type="button" class="btn btn-outline" onclick="VG_APP.closeFeedbackModal()">取消</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="js/data.js?v=1.0.33"></script>
  <script src="js/data-opd3.js"></script>
  <script src="js/data-oxford.js?v=1.0.33"></script>
  <script src="js/data-phonetics.js?v=1.0.33"></script>
  <script src="js/srs.js?v=1.0.33"></script>
  <script src="js/store.js?v=1.0.33"></script>
  <script src="js/speak-workshop.js?v=1.0.33"></script>
  <script src="js/difficulty-level.js?v=1.0.33"></script>
  <script src="js/gamification.js?v=1.0.33"></script>
  <script src="js/app.js?v=1.0.33"></script>
  <script src="js/update.js?v=1.0.33"></script>
  <script src="js/feedback.js?v=1.0.33"></script>
  <script src="js/stats-panel.js?v=1.0.33"></script>
  <script src="js/immersion.js?v=1.0.33"></script>
  <script src="js/ai-assistant.js?v=1.0.33"></script>
  <script src="assets/vendor/confetti.browser.min.js"></script>
  <script src="assets/vendor/chart.umd.js"></script>
</body>
</html>
