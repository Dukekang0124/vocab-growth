# 词汇生长 · APK 云端打包（GitHub Actions）
# 手动触发（Actions 页 → Build APK → Run）。ubuntu-latest 自带 Android SDK。
# 签名密钥 vocab-release.keystore 首次构建时生成并 commit 回仓库固化——
# 保证每次构建签名一致，APK 可覆盖安装（WebView 里的学习数据不丢）。
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install deps & sync web into android assets
        run: |
          npm install --no-audit --no-fund
          npx cap sync android

      # 体积闸门：cap sync 不读 .gitignore，app/ 里混进归档/依赖会把 APK 撑到 90MB。
      # >20MB 或含 apk/zip 直接 fail，防止回归。
      - name: Size gate (web assets <= 20MB, no apk/zip)
        run: |
          ASSETS=android/app/src/main/assets/public
          SIZE_MB=$(du -sm "$ASSETS" | cut -f1)
          echo "web assets size: ${SIZE_MB}MB"
          BAD=$(find "$ASSETS" -type f \( -name '*.apk' -o -name '*.zip' \) -print)
          if [ -n "$BAD" ]; then
            echo "::error::发现打包进 assets 的归档文件（apk/zip）："; echo "$BAD"; exit 1
          fi
          if [ "$SIZE_MB" -gt 20 ]; then
            echo "::error::web 资产 ${SIZE_MB}MB 超过 20MB 上限，检查 app/ 是否混入 apk-releases/node_modules"; exit 1
          fi

      - name: Create keystore if missing (committed for stable signing)
        run: |
          if [ ! -f android/vocab-release.keystore ]; then
            keytool -genkeypair -v -keystore android/vocab-release.keystore -alias vocab \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass vocab1234 -keypass vocab1234 \
              -dname "CN=Vocab Growth, O=SuBuJuan, C=CN"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/vocab-release.keystore
            git commit -m "chore: 固化 APK 签名密钥（保证覆盖安装签名一致）"
            git push
          fi

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          android/gradlew assembleRelease -p android --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vocab-growth-apk
          path: android/app/build/outputs/apk/release/app-release.apk
