name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload app directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # APK 用户更新检测的备通道走 jsDelivr（对 @main 文件缓存最长 12h），
      # 每次部署后主动 purge 清单，保证 jsDelivr 备源与 Pages 同步新鲜
      - name: Purge jsDelivr manifest cache
        run: curl -s "https://purge.jsdelivr.net/gh/Dukekang0124/vocab-growth@main/app/update-manifest.json" || true
