<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>公众号封面-千万别跟读</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #222; display: flex; align-items: center; justify-content: center; height: 100vh; }
.cover {
  width: 900px;
  height: 383px;
  position: relative;
  overflow: hidden;
  border-radius: 8px;
}
.cover img.bg {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 60% 30%;
  filter: brightness(0.75);
}
.overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.35) 45%, rgba(0,0,0,0.05) 70%);
}
.text {
  position: absolute;
  left: 48px;
  top: 50%;
  transform: translateY(-50%);
  color: #fff;
  font-family: "Microsoft YaHei", sans-serif;
}
.title-main {
  font-size: 56px;
  font-weight: 900;
  line-height: 1.15;
  letter-spacing: 2px;
  text-shadow: 0 3px 12px rgba(0,0,0,0.6);
}
.title-main .red {
  color: #ff4757;
}
.sub {
  margin-top: 14px;
  font-size: 22px;
  font-weight: 500;
  color: #f0f0f0;
  letter-spacing: 1px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
}
.brand {
  position: absolute;
  right: 18px;
  bottom: 14px;
  color: rgba(255,255,255,0.85);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 1px;
  background: rgba(0,0,0,0.35);
  padding: 4px 12px;
  border-radius: 14px;
}
</style>
</head>
<body>
<div class="cover">
  <img class="bg" src="file:///D:/写作工具/知识管理/01-Projects-项目/OPC指挥部/九思对外输出/06-设计源文件/gengdu-body2.png">
  <div class="overlay"></div>
  <div class="text">
    <div class="title-main">零基础练口语<br>千万别<span class="red">跟读</span></div>
    <div class="sub">跟读一年满分，开口却说不出来</div>
  </div>
  <div class="brand">苏不倦 · 英语过来人</div>
</div>
</body>
</html>
