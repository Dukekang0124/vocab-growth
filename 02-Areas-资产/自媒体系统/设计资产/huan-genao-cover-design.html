<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #222; display: flex; align-items: center; justify-content: center; height: 100vh; }
.cover {
  width: 900px; height: 1200px; position: relative; overflow: hidden; border-radius: 8px;
}
.cover img.bg {
  width: 100%; height: 100%; object-fit: cover; object-position: center 40%; filter: brightness(0.75);
}
.overlay {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
}
.text-top {
  position: absolute; top: 60px; left: 0; right: 0; text-align: center;
  color: #fff; font-family: "Microsoft YaHei", sans-serif;
}
.tag {
  display: inline-block; font-size: 26px; font-weight: 600; color: #ffd34d;
  background: rgba(0,0,0,0.45); padding: 8px 22px; border-radius: 30px;
  letter-spacing: 3px;
}
.title {
  margin-top: 18px; font-size: 72px; font-weight: 900; letter-spacing: 6px;
  text-shadow: 0 4px 16px rgba(0,0,0,0.7);
}
.title .light { color: #ffd34d; }
.text-bottom {
  position: absolute; bottom: 80px; left: 0; right: 0; text-align: center;
  color: #fff; font-family: "Microsoft YaHei", sans-serif;
}
.sub {
  font-size: 30px; font-weight: 500; letter-spacing: 2px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.6);
}
.brand {
  margin-top: 14px; font-size: 20px; font-weight: 600; color: rgba(255,255,255,0.85);
  background: rgba(0,0,0,0.4); display: inline-block; padding: 6px 18px; border-radius: 20px;
}
</style>
</head>
<body>
<div class="cover">
  <img class="bg" src="file:///C:/Users/Admin/AppData/Local/Temp/coverwork/huan-genao-bg.png">
  <div class="overlay"></div>
  <div class="text-top">
    <div class="tag">苏不倦 · 认知纠错系列</div>
    <div class="title">换<span class="light">个</span>脑子</div>
  </div>
  <div class="text-bottom">
    <div class="sub">学不会，不是你不努力——是你想错了</div>
    <div class="brand">英语·过来人的踩坑实录</div>
  </div>
</div>
</body>
</html>
