<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
@font-face { font-family: "WenKai"; src: url("file:///D:/写作工具/知识管理/01-Projects-项目/OPC指挥部/播客创作/fonts/luxiwenkai.ttf"); }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0a0a12; }
.cover { width: 1000px; height: 1000px; position: relative; overflow: hidden; background: #0d1b2a; }
.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; }
.dark-fade { position: absolute; inset: 0; z-index: 3; background: radial-gradient(ellipse at center, rgba(13,27,42,0.55) 0%, rgba(13,27,42,0.25) 60%, transparent 100%); }

/* 装饰元素（参考图风格）*/
.bubble { position: absolute; z-index: 6; width: 90px; height: 60px; background: rgba(255,159,67,0.9); border-radius: 18px; top: 12%; left: 10%; display: flex; align-items: center; justify-content: center; gap: 6px; }
.bubble::after { content: ''; position: absolute; bottom: -10px; left: 18px; border: 10px solid transparent; border-top-color: rgba(255,159,67,0.9); }
.bubble span { width: 12px; height: 12px; background: #fff; border-radius: 50%; }
.tag { position: absolute; z-index: 6; bottom: 22%; right: 10%; background: rgba(255,200,87,0.85); padding: 12px 22px; border-radius: 8px; transform: rotate(-6deg); }
.tag span { font-family: "Arial", sans-serif; font-size: 26px; font-weight: 900; color: #0d1b2a; letter-spacing: 2px; }
.ring1 { position: absolute; z-index: 5; width: 160px; height: 160px; border: 3px solid rgba(94,234,212,0.5); border-radius: 50%; top: 18%; right: 12%; }
.ring2 { position: absolute; z-index: 5; width: 90px; height: 90px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; bottom: 15%; left: 18%; }
.line1 { position: absolute; z-index: 5; width: 200px; height: 3px; background: linear-gradient(90deg, transparent, rgba(94,234,212,0.7)); top: 30%; left: -20px; transform: rotate(-15deg); }

/* 标题（粗犷艺术字）*/
.title-wrap { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.title { font-family: "WenKai", "Microsoft YaHei", sans-serif; font-size: 220px; font-weight: 900; letter-spacing: 6px; display: flex; gap: 10px; color: #fff; text-shadow: 0 6px 0 rgba(13,27,42,0.4), 0 12px 40px rgba(0,0,0,0.5); }
.evolve { color: #5eead4; text-shadow: 0 6px 0 rgba(13,27,42,0.4), 0 0 45px rgba(94,234,212,0.7); }
.en-sub { margin-top: 24px; font-family: "Arial", sans-serif; font-size: 34px; font-weight: 700; color: rgba(255,255,255,0.85); letter-spacing: 10px; text-transform: uppercase; }
.cn-sub { margin-top: 14px; font-family: "WenKai", "Microsoft YaHei", sans-serif; font-size: 42px; color: rgba(255,255,255,0.9); letter-spacing: 6px; }
.brand { position: absolute; bottom: 70px; left: 0; right: 0; z-index: 10; text-align: center; font-family: "WenKai", "Microsoft YaHei", sans-serif; font-size: 34px; color: rgba(255,255,255,0.8); letter-spacing: 4px; }
</style></head><body>
<div class="cover">
  <img class="bg" src="file:///D:/写作工具/知识管理/01-Projects-项目/OPC指挥部/播客创作/02-音频/头像风格/参考图风/abstract-bg.png">
  <div class="dark-fade"></div>
  <div class="bubble"><span></span><span></span><span></span></div>
  <div class="tag"><span>EVOLVE</span></div>
  <div class="ring1"></div><div class="ring2"></div><div class="line1"></div>

  <div class="title-wrap">
    <div class="title">今日<span class="evolve">进化</span></div>
    <div class="en-sub">Today's Evolution</div>
    <div class="cn-sub">一切皆可进化</div>
  </div>
  <div class="brand">九思 · 陪你进化</div>
</div>
</body></html>
