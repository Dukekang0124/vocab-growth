<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>

* { margin: 0; padding: 0; box-sizing: border-box; }
body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f5f5f7; }
.cover { width: 1000px; height: 1000px; position: relative; overflow: hidden; }
.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; }

.title-wrap { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.title { font-family: "WenKai", "Microsoft YaHei", sans-serif; font-size: 200px; color: #fff; font-weight: 700; letter-spacing: 10px; text-shadow: 0 8px 40px rgba(0,0,0,0.35), 0 0 50px rgba(0,255,200,0.25); display: flex; gap: 14px; }
.evolve { color: #5eead4; text-shadow: 0 8px 40px rgba(0,0,0,0.35), 0 0 50px rgba(94,234,212,0.5); }
.sub { margin-top: 36px; font-family: "WenKai", "Microsoft YaHei", sans-serif; font-size: 46px; color: rgba(255,255,255,0.95); letter-spacing: 8px; text-shadow: 0 4px 20px rgba(0,0,0,0.3); }
.brand { position: absolute; bottom: 75px; left: 0; right: 0; z-index: 10; text-align: center; font-family: "WenKai", "Microsoft YaHei", sans-serif; font-size: 36px; color: rgba(255,255,255,0.9); letter-spacing: 5px; text-shadow: 0 3px 15px rgba(0,0,0,0.3); }
</style></head><body>
<div class="cover">
  <img class="bg" src="file:///D:/写作工具/知识管理/01-Projects-项目/OPC指挥部/播客创作/02-音频/头像风格/柔和版/soft1.png">

  <div class="title-wrap">
    <div class="title">今日<span class="evolve">进化</span></div>
    <div class="sub">一切皆可进化</div>
  </div>
  <div class="brand">九思 · 陪你进化</div>
</div>
</body></html>
