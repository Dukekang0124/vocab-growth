<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0a0a12; }
  .cover { width: 1000px; height: 1000px; position: relative; overflow: hidden; background: #070d1f; }

  /* Seedream进化背景 */
  .bg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    z-index: 2;
  }
  /* 中央渐变压暗（文字区）*/
  .center-fade {
    position: absolute; inset: 0; z-index: 3;
    background: radial-gradient(ellipse at center, rgba(7,13,31,0.75) 0%, transparent 70%);
  }
  /* 底部品牌区渐变 */
  .bottom-fade {
    position: absolute; bottom: 0; left: 0; right: 0; height: 30%; z-index: 3;
    background: linear-gradient(0deg, rgba(7,13,31,0.95) 0%, transparent 100%);
  }

  .title-wrap {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .title {
    font-size: 190px; color: #fff; font-weight: 900; letter-spacing: 12px;
    font-family: "Microsoft YaHei", sans-serif;
    text-shadow: 0 10px 60px rgba(0,0,0,0.9), 0 0 40px rgba(0,255,200,0.3);
    display: flex; align-items: center; gap: 18px;
  }
  .title .evolve {
    color: #00ffc8;
    text-shadow: 0 10px 60px rgba(0,0,0,0.9), 0 0 60px rgba(0,255,200,0.6);
  }
  .sub {
    margin-top: 40px; font-size: 44px; color: rgba(255,255,255,0.9); font-weight: 700;
    font-family: "Microsoft YaHei", sans-serif; letter-spacing: 8px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.8);
  }

  .brand {
    position: absolute; bottom: 70px; left: 0; right: 0; z-index: 10;
    text-align: center; font-size: 36px; color: rgba(255,255,255,0.8);
    font-family: "Microsoft YaHei", sans-serif; letter-spacing: 4px;
    display: flex; align-items: center; justify-content: center; gap: 14px;
  }
  .brand .jiu {
    width: 52px; height: 52px; background: rgba(0,255,200,0.2); border: 2px solid rgba(0,255,200,0.5);
    border-radius: 14px; display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 900; color: #00ffc8;
  }
  .deco { position: absolute; z-index: 4; }
  .dot1 { width: 18px; height: 18px; background: rgba(0,255,200,0.8); border-radius: 50%; top: 12%; left: 20%; box-shadow: 0 0 30px rgba(0,255,200,1); }
  .dot2 { width: 12px; height: 12px; background: rgba(255,255,255,0.6); border-radius: 50%; top: 22%; right: 22%; }
  .ring { width: 130px; height: 130px; border: 3px solid rgba(0,255,200,0.4); border-radius: 50%; bottom: 25%; left: 15%; }
</style>
</head>
<body>
  <div class="cover">
    <img class="bg" src="file:///D:/写作工具/知识管理/01-Projects-项目/OPC指挥部/播客创作/02-音频/头像背景.png" alt="bg">
    <div class="center-fade"></div>
    <div class="bottom-fade"></div>
    <div class="deco dot1"></div>
    <div class="deco dot2"></div>
    <div class="deco ring"></div>

    <div class="title-wrap">
      <div class="title">今日<span class="evolve">进化</span></div>
      <div class="sub">一切皆可进化</div>
    </div>

    <div class="brand">
      <div class="jiu">九</div>
      <span>九思 · 陪你进化</span>
    </div>
  </div>
</body>
</html>
