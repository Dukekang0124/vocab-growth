<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #fff; }
  .cover {
    width: 900px; height: 383px;
    background: linear-gradient(135deg, #0f3460 0%, #1a1a2e 60%, #16213e 100%);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    padding: 0 70px;
  }
  /* 背景光晕 */
  .glow { position: absolute; border-radius: 50%; filter: blur(50px); opacity: 0.4; }
  .g1 { width: 300px; height: 300px; background: #4ecdc4; top: -80px; right: -50px; }
  .g2 { width: 250px; height: 250px; background: #e94560; bottom: -80px; left: 30%; }
  
  /* 左侧文字 */
  .left { position: relative; z-index: 10; max-width: 480px; }
  .badge {
    display: inline-block;
    background: rgba(78,205,196,0.15);
    border: 1px solid rgba(78,205,196,0.5);
    color: #4ecdc4;
    font-size: 15px;
    padding: 6px 16px;
    border-radius: 20px;
    margin-bottom: 22px;
    font-family: "Microsoft YaHei", sans-serif;
    letter-spacing: 2px;
  }
  .title {
    color: #fff;
    font-size: 44px;
    font-weight: 900;
    line-height: 1.3;
    font-family: "Microsoft YaHei", sans-serif;
    margin-bottom: 16px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.3);
  }
  .title .hl {
    color: #4ecdc4;
  }
  .sub {
    color: rgba(255,255,255,0.65);
    font-size: 18px;
    line-height: 1.6;
    font-family: "Microsoft YaHei", sans-serif;
  }
  
  /* 右侧装饰：对话框 */
  .right { position: relative; z-index: 10; margin-left: auto; }
  .chat {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 20px 24px;
    width: 260px;
  }
  .chat-q {
    color: #fff; font-size: 16px; font-family: "Microsoft YaHei", sans-serif;
    margin-bottom: 10px;
  }
  .chat-a {
    color: #4ecdc4; font-size: 14px; font-family: "Microsoft YaHei", sans-serif;
    background: rgba(78,205,196,0.1);
    border-radius: 10px; padding: 10px 14px;
  }
  .chat-x {
    color: rgba(255,255,255,0.4); font-size: 22px; text-align: center;
    margin: 8px 0; font-family: "Microsoft YaHei", sans-serif;
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="left">
      <div class="badge">九思OS · AI小白入门</div>
      <div class="title">怎么问AI才能得到<br><span class="hl">好答案？</span></div>
      <div class="sub">问AI的万能公式：一句话说清你的需求</div>
    </div>
    <div class="right">
      <div class="chat">
        <div class="chat-q">"怎么学英语？"</div>
        <div class="chat-x">✕</div>
        <div class="chat-a">"我英语基础差，每天30分钟，不想背单词，帮我定个能坚持的计划。"</div>
      </div>
    </div>
  </div>
</body>
</html>
