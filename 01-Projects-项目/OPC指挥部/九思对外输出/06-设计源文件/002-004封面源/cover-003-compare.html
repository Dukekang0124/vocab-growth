<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #fff; font-family: "Microsoft YaHei", sans-serif; }
  .card {
    width: 800px; padding: 40px;
    display: flex; gap: 30px;
    border-radius: 20px; box-shadow: 0 4px 30px rgba(0,0,0,0.08);
  }
  .col { flex: 1; border-radius: 16px; padding: 28px 24px; }
  .bad { background: #fef2f2; border: 2px solid #fecaca; }
  .good { background: #f0fdf4; border: 2px solid #bbf7d0; }
  .tag {
    display: inline-block; font-size: 13px; font-weight: 700;
    padding: 4px 12px; border-radius: 12px; margin-bottom: 16px;
  }
  .bad .tag { background: #fee2e2; color: #dc2626; }
  .good .tag { background: #dcfce7; color: #16a34a; }
  .title { font-size: 16px; font-weight: 700; margin-bottom: 14px; color: #1f2937; }
  .item {
    display: flex; align-items: center; gap: 10px;
    font-size: 14px; color: #374151; margin-bottom: 10px; line-height: 1.5;
  }
  .icon { font-size: 16px; width: 22px; text-align: center; }
  .bottom {
    margin-top: 14px; padding-top: 14px; border-top: 1px dashed #e5e7eb;
    font-size: 13px; font-weight: 700;
  }
  .bad .bottom { color: #dc2626; }
  .good .bottom { color: #16a34a; }
</style>
</head>
<body>
  <div class="card">
    <div class="col bad">
      <span class="tag">❌ 收藏方法</span>
      <div class="title">"我看见了"</div>
      <div class="item"><span class="icon">📌</span> 看到就存</div>
      <div class="item"><span class="icon">✅</span> 觉得"学到了"</div>
      <div class="item"><span class="icon">📚</span> 收藏夹越来越满</div>
      <div class="item"><span class="icon">💤</span> 三个月后全忘</div>
      <div class="bottom">收藏 = 我看见了</div>
    </div>
    <div class="col good">
      <span class="tag">✅ 用方法</span>
      <div class="title">"我做到了"</div>
      <div class="item"><span class="icon">🔧</span> 遇到问题就试</div>
      <div class="item"><span class="icon">📊</span> 用完看效果</div>
      <div class="item"><span class="icon">🎯</span> 会用的一两个越来越熟</div>
      <div class="item"><span class="icon">💪</span> 三个月后成肌肉记忆</div>
      <div class="bottom">用 = 我做到了</div>
    </div>
  </div>
</body>
</html>
