<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1a1a1a; }
  .cover { width: 1242px; height: 1660px; position: relative; overflow: hidden; background: linear-gradient(170deg, #0f1e3d 0%, #1a2f5e 50%, #2a4a8f 90%, #d84a8a 120%); }

  .bg-grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(0,255,200,0.06) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0,255,200,0.06) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .bg-glow {
    position: absolute; top: -150px; right: -150px;
    width: 600px; height: 600px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,255,200,0.2), transparent 60%);
  }
  .bg-glow2 {
    position: absolute; bottom: -150px; left: -150px;
    width: 600px; height: 600px; border-radius: 50%;
    background: radial-gradient(circle, rgba(216,74,138,0.2), transparent 60%);
  }

  .deco { position: absolute; z-index: 2; }
  .circle { width: 130px; height: 130px; border: 3px solid rgba(0,255,200,0.35); border-radius: 50%; top: 10%; left: 7%; }
  .square { width: 55px; height: 55px; border: 3px solid rgba(255,209,102,0.45); border-radius: 12px; top: 22%; right: 9%; transform: rotate(15deg); }
  .ring { width: 220px; height: 220px; border: 2px dashed rgba(255,255,255,0.18); border-radius: 50%; bottom: 20%; right: 4%; }

  .top-tag {
    position: absolute; top: 50px; left: 50px; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.25);
    border-radius: 50px; padding: 12px 24px;
  }
  .top-tag .jiu { width: 40px; height: 40px; background: rgba(0,255,200,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; color: #00ffc8; }
  .top-tag .name { font-size: 20px; color: rgba(255,255,255,0.9); font-weight: bold; letter-spacing: 2px; font-family: "Microsoft YaHei", sans-serif; }

  .title-area {
    position: absolute; top: 150px; left: 60px; right: 60px; z-index: 10;
  }
  .badge {
    display: inline-block; background: #e94560; color: #fff;
    font-size: 24px; font-weight: 900; padding: 12px 26px; border-radius: 10px;
    font-family: "Microsoft YaHei", sans-serif; margin-bottom: 25px;
    box-shadow: 0 4px 20px rgba(233,69,96,0.4); transform: rotate(-2deg);
  }
  .q-line {
    font-size: 36px; color: rgba(255,255,255,0.75); font-weight: 500;
    font-family: "Microsoft YaHei", sans-serif; margin-bottom: 15px;
  }
  .title {
    font-size: 92px; color: #fff; font-weight: 900; line-height: 1.25;
    font-family: "Microsoft YaHei", sans-serif;
    text-shadow: 0 6px 40px rgba(0,0,0,0.8);
  }
  .title .hl-green { color: #00ffc8; }
  .title .hl-yellow { color: #ffd166; }
  .sub {
    margin-top: 25px; font-size: 36px; color: rgba(255,255,255,0.9); font-weight: 700;
    font-family: "Microsoft YaHei", sans-serif;
    border-left: 6px solid #00ffc8; padding-left: 20px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.7);
  }

  /* 卡通人物（居中，比真人更卡通更亲和）*/
  .cartoon {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    height: 50%; z-index: 5;
    filter: drop-shadow(0 -20px 60px rgba(0,0,0,0.4));
    border-radius: 30px;
  }
  .cartoon-tag {
    position: absolute; bottom: 38%; right: 25%; z-index: 6;
    background: #e94560; color: #fff;
    font-size: 24px; font-weight: 900; padding: 12px 24px; border-radius: 10px;
    font-family: "Microsoft YaHei", sans-serif;
    transform: rotate(3deg);
    box-shadow: 0 8px 30px rgba(233,69,96,0.5);
  }

  .follow-bar {
    position: absolute; bottom: 40px; left: 60px; right: 60px; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 50px; padding: 16px 26px;
    backdrop-filter: blur(6px);
  }
  .follow-bar .brand { font-size: 18px; color: rgba(255,255,255,0.8); font-family: "Microsoft YaHei", sans-serif; }
  .follow-bar .follow { font-size: 17px; color: #00ffc8; font-family: "Microsoft YaHei", sans-serif; font-weight: bold; }
</style>
</head>
<body>
  <div class="cover">
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
    <div class="bg-glow2"></div>
    <div class="deco circle"></div>
    <div class="deco square"></div>
    <div class="deco ring"></div>

    <div class="top-tag">
      <div class="jiu">九</div>
      <div class="name">九思OS · 会进化的智生体</div>
    </div>

    <div class="title-area">
      <div class="badge">🔥 认知升级</div>
      <div class="q-line">你收藏了100篇AI教程，却还是用不好AI？</div>
      <div class="title">学了那么多<br><span class="hl-green">AI技巧</span><br>为什么<span class="hl-yellow">还是用不好</span>？</div>
      <div class="sub">你缺的不是技巧，是方法</div>
    </div>

    <img class="cartoon" src="file:///D:/写作工具/知识管理/01-Projects-项目/OPC指挥部/九思对外输出/06-设计源文件/cartoon-me.png" alt="cartoon me">
    <div class="cartoon-tag">👇 点这里</div>

    <div class="follow-bar">
      <div class="brand">九思OS</div>
      <div class="follow">关注 → 每天一个AI认知</div>
    </div>
  </div>
</body>
</html>
