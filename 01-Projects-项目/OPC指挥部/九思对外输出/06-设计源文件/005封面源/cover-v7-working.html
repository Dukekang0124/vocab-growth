<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0a0a12; }
  .cover { width: 1242px; height: 1660px; position: relative; overflow: hidden; background: #070d1f; }

  /* 人物做事场景（整图，主题=跟AI协作）*/
  .bg-scene { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* 顶部渐变压暗（放标题）*/
  .top-fade {
    position: absolute; top: 0; left: 0; right: 0; height: 50%; z-index: 3;
    background: linear-gradient(180deg, rgba(7,13,31,0.95) 0%, rgba(7,13,31,0.75) 40%, transparent 100%);
  }
  .bottom-fade {
    position: absolute; bottom: 0; left: 0; right: 0; height: 20%; z-index: 3;
    background: linear-gradient(0deg, rgba(7,13,31,0.9) 0%, transparent 100%);
  }

  /* HUD装饰叠加 */
  .deco { position: absolute; z-index: 4; }
  .hud-circle { width: 130px; height: 130px; border: 2px solid rgba(0,255,200,0.45); border-radius: 50%; top: 6%; right: 7%; }
  .hud-square { width: 55px; height: 55px; border: 2px solid rgba(255,209,102,0.55); border-radius: 10px; top: 16%; left: 7%; transform: rotate(15deg); }
  .hud-ring { width: 220px; height: 220px; border: 2px dashed rgba(0,255,200,0.3); border-radius: 50%; bottom: 12%; right: 3%; }
  .hud-dot { width: 12px; height: 12px; background: rgba(0,255,200,0.7); border-radius: 50%; top: 10%; left: 30%; box-shadow: 0 0 25px rgba(0,255,200,0.9); }

  .top-tag {
    position: absolute; top: 50px; left: 50px; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    background: rgba(0,255,200,0.08); border: 1.5px solid rgba(0,255,200,0.35);
    border-radius: 50px; padding: 12px 24px; backdrop-filter: blur(6px);
  }
  .top-tag .jiu { width: 40px; height: 40px; background: rgba(0,255,200,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; color: #00ffc8; }
  .top-tag .name { font-size: 20px; color: rgba(255,255,255,0.95); font-weight: bold; letter-spacing: 2px; font-family: "Microsoft YaHei", sans-serif; }

  .title-area {
    position: absolute; top: 150px; left: 55px; right: 55px; z-index: 10;
  }
  .badge {
    display: inline-block; background: linear-gradient(90deg, #e94560, #ff6b81); color: #fff;
    font-size: 24px; font-weight: 900; padding: 12px 26px; border-radius: 10px;
    font-family: "Microsoft YaHei", sans-serif; margin-bottom: 25px;
    box-shadow: 0 4px 25px rgba(233,69,96,0.5); transform: rotate(-2deg);
  }
  .q-line {
    font-size: 36px; color: rgba(255,255,255,0.85); font-weight: 500;
    font-family: "Microsoft YaHei", sans-serif; margin-bottom: 15px;
    text-shadow: 0 2px 15px rgba(0,0,0,0.8);
  }
  .title {
    font-size: 92px; color: #fff; font-weight: 900; line-height: 1.25;
    font-family: "Microsoft YaHei", sans-serif;
    text-shadow: 0 6px 40px rgba(0,0,0,0.9);
  }
  .title .hl-green { color: #00ffc8; text-shadow: 0 0 30px rgba(0,255,200,0.5); }
  .title .hl-yellow { color: #ffd166; text-shadow: 0 0 30px rgba(255,209,102,0.5); }
  .sub {
    margin-top: 25px; font-size: 36px; color: rgba(255,255,255,0.95); font-weight: 700;
    font-family: "Microsoft YaHei", sans-serif;
    border-left: 6px solid #00ffc8; padding-left: 20px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.8);
  }

  .follow-bar {
    position: absolute; bottom: 35px; left: 55px; right: 55px; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(0,255,200,0.06); border: 1px solid rgba(0,255,200,0.25);
    border-radius: 50px; padding: 16px 26px; backdrop-filter: blur(8px);
  }
  .follow-bar .brand { font-size: 18px; color: rgba(255,255,255,0.85); font-family: "Microsoft YaHei", sans-serif; }
  .follow-bar .follow { font-size: 17px; color: #00ffc8; font-family: "Microsoft YaHei", sans-serif; font-weight: bold; }
</style>
</head>
<body>
  <div class="cover">
    <img class="bg-scene" src="file:///D:/写作工具/知识管理/01-Projects-项目/OPC指挥部/九思对外输出/06-设计源文件/cartoon-working.png" alt="scene">
    <div class="top-fade"></div>
    <div class="bottom-fade"></div>

    <div class="deco hud-circle"></div>
    <div class="deco hud-square"></div>
    <div class="deco hud-ring"></div>
    <div class="deco hud-dot"></div>

    <div class="top-tag">
      <div class="jiu">九</div>
      <div class="name">九思OS · 会进化的智生体</div>
    </div>

    <div class="title-area">
      <div class="badge">⚡ 和AI协作</div>
      <div class="q-line">别人用AI效率翻倍，你却还在问"怎么用"？</div>
      <div class="title">学了那么多<br><span class="hl-green">AI技巧</span><br>为什么<span class="hl-yellow">还是用不好</span>？</div>
      <div class="sub">你缺的不是技巧，是方法</div>
    </div>

    <div class="follow-bar">
      <div class="brand">九思OS</div>
      <div class="follow">关注 → 每天一个AI认知</div>
    </div>
  </div>
</body>
</html>
