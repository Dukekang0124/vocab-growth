<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1a1a1a; }
  .cover { width: 1242px; height: 1660px; position: relative; overflow: hidden; }

  /* 卡通场景图（作背景，整图融合）*/
  .bg-scene { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* 顶部渐变（压暗上方放标题）*/
  .top-fade {
    position: absolute; top: 0; left: 0; right: 0; height: 55%; z-index: 3;
    background: linear-gradient(180deg, rgba(10,16,32,0.92) 0%, rgba(10,16,32,0.7) 40%, transparent 100%);
  }
  .bottom-fade {
    position: absolute; bottom: 0; left: 0; right: 0; height: 25%; z-index: 3;
    background: linear-gradient(0deg, rgba(10,16,32,0.9) 0%, transparent 100%);
  }

  /* 装饰元素（叠加在场景上）*/
  .deco { position: absolute; z-index: 4; }
  .circle { width: 130px; height: 130px; border: 3px solid rgba(0,255,200,0.5); border-radius: 50%; top: 8%; right: 8%; }
  .square { width: 55px; height: 55px; border: 3px solid rgba(255,209,102,0.6); border-radius: 12px; top: 18%; left: 8%; transform: rotate(15deg); }
  .ring { width: 200px; height: 200px; border: 2px dashed rgba(255,255,255,0.25); border-radius: 50%; bottom: 15%; right: 5%; }

  .top-tag {
    position: absolute; top: 50px; left: 50px; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,255,255,0.3);
    border-radius: 50px; padding: 12px 24px; backdrop-filter: blur(6px);
  }
  .top-tag .jiu { width: 40px; height: 40px; background: rgba(0,255,200,0.25); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; color: #00ffc8; }
  .top-tag .name { font-size: 20px; color: #fff; font-weight: bold; letter-spacing: 2px; font-family: "Microsoft YaHei", sans-serif; }

  .title-area {
    position: absolute; top: 160px; left: 55px; right: 55px; z-index: 10;
  }
  .badge {
    display: inline-block; background: #e94560; color: #fff;
    font-size: 24px; font-weight: 900; padding: 12px 26px; border-radius: 10px;
    font-family: "Microsoft YaHei", sans-serif; margin-bottom: 25px;
    box-shadow: 0 4px 20px rgba(233,69,96,0.5); transform: rotate(-2deg);
  }
  .q-line {
    font-size: 36px; color: rgba(255,255,255,0.8); font-weight: 500;
    font-family: "Microsoft YaHei", sans-serif; margin-bottom: 15px;
    text-shadow: 0 2px 15px rgba(0,0,0,0.8);
  }
  .title {
    font-size: 92px; color: #fff; font-weight: 900; line-height: 1.25;
    font-family: "Microsoft YaHei", sans-serif;
    text-shadow: 0 6px 40px rgba(0,0,0,0.9);
  }
  .title .hl-green { color: #00ffc8; }
  .title .hl-yellow { color: #ffd166; }
  .sub {
    margin-top: 25px; font-size: 36px; color: rgba(255,255,255,0.95); font-weight: 700;
    font-family: "Microsoft YaHei", sans-serif;
    border-left: 6px solid #00ffc8; padding-left: 20px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.8);
  }

  /* 底部信息 */
  .follow-bar {
    position: absolute; bottom: 35px; left: 55px; right: 55px; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50px; padding: 16px 26px; backdrop-filter: blur(8px);
  }
  .follow-bar .brand { font-size: 18px; color: rgba(255,255,255,0.85); font-family: "Microsoft YaHei", sans-serif; }
  .follow-bar .follow { font-size: 17px; color: #00ffc8; font-family: "Microsoft YaHei", sans-serif; font-weight: bold; }
</style>
</head>
<body>
  <div class="cover">
    <!-- 卡通场景图作背景（003：沙发刷手机思考）-->
    <img class="bg-scene" src="file:///D:/写作工具/知识管理/01-Projects-项目/OPC指挥部/九思对外输出/06-设计源文件/cartoon-003.png" alt="scene">
    <div class="top-fade"></div>
    <div class="bottom-fade"></div>

    <div class="deco circle"></div>
    <div class="deco square"></div>
    <div class="deco ring"></div>

    <div class="top-tag">
      <div class="jiu">九</div>
      <div class="name">九思OS · 会进化的智生体</div>
    </div>

    <div class="title-area">
      <div class="badge">🎯 认知升级</div>
      <div class="q-line">你收藏了100篇AI教程，却还是用不好？</div>
      <div class="title">学了那么多<br><span class="hl-green">AI技巧</span><br>为什么<span class="hl-yellow">还是用不好</span>？</div>
      <div class="sub">你缺的不是技巧，是方法</div>
    </div>

    <div class="follow-bar">
      <div class="brand">九思OS</div>
      <div class="follow">关注 → 每天一个AI认知</div>
    </div>
  </div>
</body>
</html>
