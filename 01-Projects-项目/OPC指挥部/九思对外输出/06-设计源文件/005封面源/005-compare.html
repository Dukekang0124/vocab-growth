<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #fff; }
  .card { width: 800px; display: flex; gap: 0; font-family: "Microsoft YaHei", sans-serif; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
  .side { flex: 1; padding: 40px 30px; }
  .bad { background: #fdecea; border-right: 3px solid #e94560; }
  .good { background: #e8f5e9; border-right: 3px solid #4caf50; }
  .side:last-child { border-right: none; }
  .tag { font-size: 20px; font-weight: 900; margin-bottom: 20px; }
  .bad .tag { color: #e94560; }
  .good .tag { color: #4caf50; }
  .item { display: flex; align-items: center; gap: 12px; font-size: 17px; color: #333; padding: 10px 0; border-bottom: 1px dashed rgba(0,0,0,0.08); }
  .item:last-child { border-bottom: none; }
  .icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .bad .icon { background: #fdd; color: #e94560; }
  .good .icon { background: #d5f5d6; color: #4caf50; }
</style>
</head>
<body>
  <div class="card">
    <div class="side bad">
      <div class="tag">先学后做 ❌</div>
      <div class="item"><div class="icon">📚</div>学一堆"可能有用"的</div>
      <div class="item"><div class="icon">😵</div>记不住（没场景）</div>
      <div class="item"><div class="icon">⏳</div>一直"准备中"</div>
      <div class="item"><div class="icon">😰</div>越学越焦虑</div>
    </div>
    <div class="side good">
      <div class="tag">先做后学 ✅</div>
      <div class="item"><div class="icon">🛠️</div>学"正在用到"的</div>
      <div class="item"><div class="icon">🧠</div>忘不掉（用了就记住）</div>
      <div class="item"><div class="icon">🚀</div>一直在"前进"</div>
      <div class="item"><div class="icon">😌</div>越做越有底</div>
    </div>
  </div>
</body>
</html>
