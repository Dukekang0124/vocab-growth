<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1a1a1a; }
  .cover { width: 1242px; height: 1660px; position: relative; overflow: hidden; background: #0d1117; }

  /* 背景质感：深色+几何纹理+光效 */
  .bg-grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(0,255,200,0.05) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0,255,200,0.05) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .bg-glow {
    position: absolute; top: -200px; right: -200px;
    width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,255,200,0.15), transparent 60%);
  }
  .bg-glow2 {
    position: absolute; bottom: -200px; left: -200px;
    width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(216,74,138,0.15), transparent 60%);
  }

  /* 装饰：几何形状 */
  .deco { position: absolute; z-index: 2; }
  .circle { width: 120px; height: 120px; border: 3px solid rgba(0,255,200,0.3); border-radius: 50%; top: 12%; left: 8%; }
  .square { width: 50px; height: 50px; border: 3px solid rgba(255,209,102,0.4); border-radius: 12px; top: 25%; right: 10%; transform: rotate(15deg); }
  .ring { width: 200px; height: 200px; border: 2px dashed rgba(255,255,255,0.15); border-radius: 50%; bottom: 25%; right: 5%; }

  /* 顶部标签 */
  .top-tag {
    position: absolute; top: 50px; left: 50px; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.25);
    border-radius: 50px; padding: 12px 24px;
  }
  .top-tag .jiu { width: 40px; height: 40px; background: rgba(0,255,200,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; color: #00ffc8; }
  .top-tag .name { font-size: 20px; color: rgba(255,255,255,0.9); font-weight: bold; letter-spacing: 2px; font-family: "Microsoft YaHei", sans-serif; }

  /* 标题区：多色文字层次（学第三张）*/
  .title-area {
    position: absolute; top: 140px; left: 60px; right: 60px; z-index: 10;
  }
  .badge {
    display: inline-block; background: #e94560; color: #fff;
    font-size: 22px; font-weight: 900; padding: 10px 22px; border-radius: 8px;
    font-family: "Microsoft YaHei", sans-serif; margin-bottom: 25px;
    box-shadow: 0 4px 20px rgba(233,69,96,0.4);
    transform: rotate(-2deg);
  }
  .q-line {
    font-size: 34px; color: rgba(255,255,255,0.7); font-weight: 500;
    font-family: "Microsoft YaHei", sans-serif; margin-bottom: 15px;
  }
  .title {
    font-size: 88px; color: #fff; font-weight: 900; line-height: 1.25;
    font-family: "Microsoft YaHei", sans-serif;
    text-shadow: 0 6px 40px rgba(0,0,0,0.8);
  }
  .title .hl-green { color: #00ffc8; }
  .title .hl-yellow { color: #ffd166; }
  .sub {
    margin-top: 25px; font-size: 34px; color: rgba(255,255,255,0.9); font-weight: 700;
    font-family: "Microsoft YaHei", sans-serif;
    border-left: 6px solid #00ffc8; padding-left: 20px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.7);
  }

  /* 人物（抠图透明PNG）*/
  .person {
    position: absolute; bottom: 60px; right: 8%; z-index: 5;
    height: 45%;
    filter: drop-shadow(0 -15px 50px rgba(0,0,0,0.5));
  }

  /* 人物旁装饰标签（学第四张红色标签）*/
  .person-tag {
    position: absolute; bottom: 32%; right: 38%; z-index: 6;
    background: #e94560; color: #fff;
    font-size: 22px; font-weight: 900; padding: 12px 24px; border-radius: 8px;
    font-family: "Microsoft YaHei", sans-serif;
    transform: rotate(3deg);
    box-shadow: 0 8px 30px rgba(233,69,96,0.5);
  }

  .follow-bar {
    position: absolute; bottom: 40px; left: 60px; right: 60px; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 50px; padding: 16px 26px;
    backdrop-filter: blur(6px);
  }
  .follow-bar .brand { font-size: 18px; color: rgba(255,255,255,0.8); font-family: "Microsoft YaHei", sans-serif; }
  .follow-bar .follow { font-size: 17px; color: #00ffc8; font-family: "Microsoft YaHei", sans-serif; font-weight: bold; }
</style>
</head>
<body>
  <div class="cover">
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
    <div class="bg-glow2"></div>
    <div class="deco circle"></div>
    <div class="deco square"></div>
    <div class="deco ring"></div>

    <div class="top-tag">
      <div class="jiu">九</div>
      <div class="name">九思OS · 会进化的智生体</div>
    </div>

    <div class="title-area">
      <div class="badge">🔥 认知升级</div>
      <div class="q-line">你收藏了100篇AI教程，却还是用不好AI？</div>
      <div class="title">学了那么多<br><span class="hl-green">AI技巧</span><br>为什么<span class="hl-yellow">还是用不好</span>？</div>
      <div class="sub">你缺的不是技巧，是方法</div>
    </div>

    <img class="person" src="file:///D:/写作工具/知识管理/01-Projects-项目/OPC指挥部/九思对外输出/06-设计源文件/person-cutout.png" alt="person">
    <div class="person-tag">👇 点这里</div>

    <div class="follow-bar">
      <div class="brand">九思OS</div>
      <div class="follow">关注 → 每天一个AI认知</div>
    </div>
  </div>
</body>
</html>
