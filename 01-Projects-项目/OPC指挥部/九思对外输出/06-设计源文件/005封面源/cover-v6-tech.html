<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0a0a12; }
  .cover { width: 1242px; height: 1660px; position: relative; overflow: hidden; background: linear-gradient(170deg, #070d1f 0%, #0d1b3e 45%, #122a5e 80%, #1a3a7a 115%); }

  /* 科技背景：网格+HUD元素 */
  .bg-grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(0,255,200,0.07) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0,255,200,0.07) 1px, transparent 1px);
    background-size: 55px 55px;
  }
  .bg-glow {
    position: absolute; top: -180px; right: -180px;
    width: 650px; height: 650px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,255,200,0.18), transparent 60%);
  }
  .bg-glow2 {
    position: absolute; bottom: -180px; left: -180px;
    width: 650px; height: 650px; border-radius: 50%;
    background: radial-gradient(circle, rgba(216,74,138,0.15), transparent 60%);
  }

  /* HUD装饰元素（科技感）*/
  .deco { position: absolute; z-index: 2; }
  .hud-circle { width: 140px; height: 140px; border: 2px solid rgba(0,255,200,0.4); border-radius: 50%; top: 8%; left: 7%; }
  .hud-circle::after { content: ''; position: absolute; inset: 15px; border: 1px dashed rgba(0,255,200,0.3); border-radius: 50%; }
  .hud-square { width: 60px; height: 60px; border: 2px solid rgba(255,209,102,0.5); border-radius: 10px; top: 20%; right: 8%; transform: rotate(15deg); }
  .hud-ring { width: 240px; height: 240px; border: 2px dashed rgba(0,255,200,0.25); border-radius: 50%; bottom: 18%; right: 3%; }
  .hud-dot { width: 12px; height: 12px; background: rgba(0,255,200,0.6); border-radius: 50%; top: 12%; right: 25%; box-shadow: 0 0 20px rgba(0,255,200,0.8); }
  .hud-line { position: absolute; top: 30%; left: 6%; width: 60px; height: 3px; background: rgba(0,255,200,0.5); transform: skewX(-20deg); box-shadow: 0 0 15px rgba(0,255,200,0.6); }

  .top-tag {
    position: absolute; top: 50px; left: 50px; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    background: rgba(0,255,200,0.08); border: 1.5px solid rgba(0,255,200,0.35);
    border-radius: 50px; padding: 12px 24px; backdrop-filter: blur(6px);
  }
  .top-tag .jiu { width: 40px; height: 40px; background: rgba(0,255,200,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; color: #00ffc8; }
  .top-tag .name { font-size: 20px; color: rgba(255,255,255,0.95); font-weight: bold; letter-spacing: 2px; font-family: "Microsoft YaHei", sans-serif; }

  .title-area {
    position: absolute; top: 150px; left: 55px; right: 55px; z-index: 10;
  }
  .badge {
    display: inline-block; background: linear-gradient(90deg, #e94560, #ff6b81); color: #fff;
    font-size: 24px; font-weight: 900; padding: 12px 26px; border-radius: 10px;
    font-family: "Microsoft YaHei", sans-serif; margin-bottom: 25px;
    box-shadow: 0 4px 25px rgba(233,69,96,0.5); transform: rotate(-2deg);
  }
  .q-line {
    font-size: 36px; color: rgba(255,255,255,0.85); font-weight: 500;
    font-family: "Microsoft YaHei", sans-serif; margin-bottom: 15px;
    text-shadow: 0 2px 15px rgba(0,0,0,0.8);
  }
  .title {
    font-size: 92px; color: #fff; font-weight: 900; line-height: 1.25;
    font-family: "Microsoft YaHei", sans-serif;
    text-shadow: 0 6px 40px rgba(0,0,0,0.9);
  }
  .title .hl-green { color: #00ffc8; text-shadow: 0 0 30px rgba(0,255,200,0.5); }
  .title .hl-yellow { color: #ffd166; text-shadow: 0 0 30px rgba(255,209,102,0.5); }
  .sub {
    margin-top: 25px; font-size: 36px; color: rgba(255,255,255,0.95); font-weight: 700;
    font-family: "Microsoft YaHei", sans-serif;
    border-left: 6px solid #00ffc8; padding-left: 20px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.8);
  }

  /* 科技感卡通人物（居中）*/
  .cartoon {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    height: 52%; z-index: 5;
    filter: drop-shadow(0 -25px 70px rgba(0,255,200,0.25));
    border-radius: 30px;
  }
  .cartoon-tag {
    position: absolute; bottom: 40%; right: 22%; z-index: 6;
    background: #e94560; color: #fff;
    font-size: 24px; font-weight: 900; padding: 12px 24px; border-radius: 10px;
    font-family: "Microsoft YaHei", sans-serif;
    transform: rotate(3deg);
    box-shadow: 0 8px 30px rgba(233,69,96,0.5);
  }

  .follow-bar {
    position: absolute; bottom: 35px; left: 55px; right: 55px; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(0,255,200,0.06); border: 1px solid rgba(0,255,200,0.25);
    border-radius: 50px; padding: 16px 26px; backdrop-filter: blur(8px);
  }
  .follow-bar .brand { font-size: 18px; color: rgba(255,255,255,0.85); font-family: "Microsoft YaHei", sans-serif; }
  .follow-bar .follow { font-size: 17px; color: #00ffc8; font-family: "Microsoft YaHei", sans-serif; font-weight: bold; }
</style>
</head>
<body>
  <div class="cover">
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
    <div class="bg-glow2"></div>
    <div class="deco hud-circle"></div>
    <div class="deco hud-square"></div>
    <div class="deco hud-ring"></div>
    <div class="deco hud-dot"></div>
    <div class="deco hud-line"></div>

    <div class="top-tag">
      <div class="jiu">九</div>
      <div class="name">九思OS · 会进化的智生体</div>
    </div>

    <div class="title-area">
      <div class="badge">⚡ AI认知</div>
      <div class="q-line">你收藏了100篇AI教程，却还是用不好？</div>
      <div class="title">学了那么多<br><span class="hl-green">AI技巧</span><br>为什么<span class="hl-yellow">还是用不好</span>？</div>
      <div class="sub">你缺的不是技巧，是方法</div>
    </div>

    <img class="cartoon" src="file:///D:/写作工具/知识管理/01-Projects-项目/OPC指挥部/九思对外输出/06-设计源文件/cartoon-tech.png" alt="tech cartoon">
    <div class="cartoon-tag">👇 点这里</div>

    <div class="follow-bar">
      <div class="brand">九思OS</div>
      <div class="follow">关注 → 每天一个AI认知</div>
    </div>
  </div>
</body>
</html>
