<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>公众号封面</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 900px;
    height: 383px;
    background: #ffffff;
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    display: flex;
    overflow: hidden;
    position: relative;
  }
  /* 左侧：场景图 */
  .scene {
    position: absolute;
    left: 0;
    top: 0;
    width: 55%;
    height: 100%;
    overflow: hidden;
  }
  .scene img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: left center;
  }
  /* 右侧：标题区 */
  .title-area {
    position: absolute;
    right: 0;
    top: 0;
    width: 45%;
    height: 100%;
    background: linear-gradient(135deg, #ff8c42 0%, #ff6a3d 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px 24px;
    text-align: center;
  }
  .title-area .main {
    font-size: 34px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.3;
    letter-spacing: 1px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .title-area .sub {
    margin-top: 14px;
    font-size: 15px;
    color: rgba(255,255,255,0.92);
    letter-spacing: 1px;
  }
  .title-area .brand {
    position: absolute;
    bottom: 14px;
    font-size: 12px;
    color: rgba(255,255,255,0.75);
    letter-spacing: 2px;
  }
</style>
</head>
<body>
  <div class="scene">
    <img src="laowai_scene.png" alt="scene">
  </div>
  <div class="title-area">
    <div class="main">那个老外说得没毛病<br>学英语从儿童动画开始</div>
    <div class="sub">少儿动画入门 · 不开字幕 · 坚持就有效</div>
    <div class="brand">苏不倦</div>
  </div>
</body>
</html>
