<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #fff; }
  .avatar {
    width: 800px; height: 800px; position: relative;
    overflow: hidden; border-radius: 50%;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* 涂鸦元素（绝对定位叠加） */
  .spark { position: absolute; font-size: 90px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)); }
  .spark1 { top: 5%; right: 8%; transform: rotate(15deg); animation: pulse 1.5s infinite; }
  .spark2 { bottom: 15%; left: 6%; transform: rotate(-10deg); animation: pulse 1.8s infinite 0.3s; }
  .spark3 { top: 20%; left: 10%; font-size: 60px; animation: spin 4s linear infinite; }

  .bubble {
    position: absolute; background: #fff; border: 4px solid #000;
    border-radius: 20px; padding: 10px 18px; font-size: 42px; font-weight: 900;
    font-family: "Arial Black", sans-serif; box-shadow: 4px 4px 0 #000;
  }
  .bubble1 { top: 12%; left: 50%; transform: translateX(-50%) rotate(-3deg); }
  .bubble2 { bottom: 8%; right: 6%; transform: rotate(4deg); font-size: 36px; }

  .fire {
    position: absolute; top: -10%; left: 50%; transform: translateX(-50%);
    font-size: 130px; filter: drop-shadow(0 0 20px rgba(255,100,0,0.5));
    animation: flicker 0.5s infinite alternate;
  }

  .rainbow {
    position: absolute; bottom: 0; left: 0; width: 100%;
    height: 80px; opacity: 0.85;
    background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #1dd1a1, #ff9ff3);
    border-top: 4px dashed #fff;
  }

  @keyframes pulse { 0%, 100% { transform: scale(1) rotate(15deg); } 50% { transform: scale(1.2) rotate(25deg); } }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes flicker { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.1); } }
</style>
</head>
<body>
  <div class="avatar">
    <img src="file:///C:/Users/Admin/Desktop/微信图片_20260806204923_148_2.jpg" alt="avatar">
    <!-- 涂鸦元素 -->
    <div class="fire">🔥</div>
    <div class="spark spark1">😂</div>
    <div class="spark spark2">🤪</div>
    <div class="spark spark3">✨</div>
    <div class="bubble bubble1">？？？</div>
    <div class="bubble bubble2">搞怪！</div>
    <div class="rainbow"></div>
  </div>
</body>
</html>
