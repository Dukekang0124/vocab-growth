<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; background: #1a1a2e;
  }
  /* 头像容器 512x512 */
  .avatar {
    width: 512px; height: 512px;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    border-radius: 0;
    position: relative;
    overflow: hidden;
  }
  /* 背景光晕 */
  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.5;
  }
  .glow1 { width: 300px; height: 300px; background: #4ecdc4; top: -50px; right: -50px; }
  .glow2 { width: 250px; height: 250px; background: #e94560; bottom: -30px; left: -30px; }
  .glow3 { width: 200px; height: 200px; background: #533483; top: 40%; left: 30%; }

  /* "九"字 */
  .jiusi {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 220px;
    font-weight: 900;
    font-family: "Microsoft YaHei", "SimHei", sans-serif;
    color: #fff;
    text-shadow: 0 0 30px rgba(78, 205, 196, 0.6);
    z-index: 10;
    letter-spacing: -10px;
  }

  /* 环绕的小光点（象征九思的九个维度） */
  .dot {
    position: absolute;
    border-radius: 50%;
    background: #4ecdc4;
    z-index: 20;
    box-shadow: 0 0 15px rgba(78, 205, 196, 0.8);
  }
  .d1 { width: 14px; height: 14px; top: 18%; left: 50%; }
  .d2 { width: 10px; height: 10px; top: 28%; right: 20%; }
  .d3 { width: 12px; height: 12px; top: 38%; right: 12%; }
  .d4 { width: 8px; height: 8px; top: 52%; right: 16%; }
  .d5 { width: 12px; height: 12px; top: 62%; right: 26%; }
  .d6 { width: 8px; height: 8px; top: 70%; right: 40%; }
  .d7 { width: 11px; height: 11px; top: 66%; left: 22%; }
  .d8 { width: 9px; height: 9px; top: 48%; left: 14%; }
  .d9 { width: 13px; height: 13px; top: 30%; left: 22%; }

  /* 底部小字 */
  .brand {
    position: absolute;
    bottom: 28px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.5);
    font-size: 28px;
    font-family: "Microsoft YaHei", sans-serif;
    letter-spacing: 6px;
    z-index: 15;
  }
</style>
</head>
<body>
  <div class="avatar">
    <div class="glow glow1"></div>
    <div class="glow glow2"></div>
    <div class="glow glow3"></div>
    <div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div>
    <div class="dot d4"></div><div class="dot d5"></div><div class="dot d6"></div>
    <div class="dot d7"></div><div class="dot d8"></div><div class="dot d9"></div>
    <div class="jiusi">九</div>
    <div class="brand">九思OS</div>
  </div>
</body>
</html>
