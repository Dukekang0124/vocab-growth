<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #222; display: flex; align-items: center; justify-content: center; height: 100vh; }
.cover {
  width: 900px; height: 383px; position: relative; overflow: hidden; border-radius: 8px;
}
.cover img.bg {
  width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%;
}
/* 顶部渐变（让标题可读） */
.top-grad {
  position: absolute; top: 0; left: 0; right: 0; height: 50%;
  background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
}
/* 底部渐变 */
.bottom-grad {
  position: absolute; bottom: 0; left: 0; right: 0; height: 35%;
  background: linear-gradient(0deg, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0) 100%);
}
/* 标题放在右侧中间，不遮挡人物 */
.title-right {
  position: absolute; right: 40px; top: 50%; transform: translateY(-50%);
  color: #fff; font-family: "Microsoft YaHei", sans-serif;
  z-index: 2; text-align: right;
}
.title-main {
  font-size: 38px; font-weight: 900; line-height: 1.3; letter-spacing: 2px;
  text-shadow: 0 3px 12px rgba(0,0,0,0.8);
}
.title-main .orange { color: #ff8c42; }
/* 品牌在左下角 */
.brand {
  position: absolute; left: 16px; bottom: 12px; color: rgba(255,255,255,0.8);
  font-size: 13px; font-weight: 600; background: rgba(0,0,0,0.35);
  padding: 3px 10px; border-radius: 12px; z-index: 2;
}
/* 副标题在标题下方 */
.sub {
  font-size: 16px; font-weight: 500; color: rgba(255,255,255,0.75);
  margin-top: 8px; text-shadow: 0 2px 8px rgba(0,0,0,0.5);
}
</style>
</head>
<body>
<div class="cover">
  <img class="bg" src="file:///C:/Users/Admin/AppData/Local/Temp/coverwork/13000-bg.png">
  <div class="top-grad"></div>
  <div class="bottom-grad"></div>
  <div class="title-right">
    <div class="title-main">1.3万人劝我背单词<br>我<span class="orange">还是没背</span></div>
    <div class="sub">会用了才叫会，背下来不叫会</div>
  </div>
  <div class="brand">苏不倦 · 英语过来人</div>
</div>
</body>
</html>
