<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f5f5f5; }
  .cover { width: 1242px; height: 1660px; position: relative; overflow: hidden; }
  .bg-img { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(0.7); }

  .top-tag {
    position: absolute; top: 45px; left: 45px; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    background: rgba(15,30,61,0.85); border: 2px solid rgba(255,255,255,0.4);
    border-radius: 50px; padding: 10px 20px; backdrop-filter: blur(4px);
  }
  .top-tag .jiu { width: 34px; height: 34px; background: rgba(255,255,255,0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; color: #fff; }
  .top-tag .name { font-size: 18px; color: #fff; font-weight: bold; letter-spacing: 2px; font-family: "Microsoft YaHei", sans-serif; }

  /* 标题区：上方1/3（三分法则），标题最大 */
  .title-area {
    position: absolute; top: 130px; left: 50px; right: 50px; z-index: 20;
  }
  .badge {
    display: inline-block; background: #00ffc8; color: #0f1e3d;
    font-size: 22px; font-weight: 900; padding: 10px 22px; border-radius: 10px;
    font-family: "Microsoft YaHei", sans-serif; margin-bottom: 22px;
    box-shadow: 0 4px 15px rgba(0,255,200,0.4);
  }
  .title {
    font-size: 86px; color: #fff; font-weight: 900; line-height: 1.25;
    font-family: "Microsoft YaHei", sans-serif;
    text-shadow: 0 6px 30px rgba(0,0,0,0.7);
  }
  .title .hl { color: #00ffc8; }
  .sub {
    margin-top: 24px; font-size: 36px; color: #fff; font-weight: 700;
    font-family: "Microsoft YaHei", sans-serif;
    text-shadow: 0 4px 20px rgba(0,0,0,0.7);
  }

  .follow-bar {
    position: absolute; bottom: 40px; left: 50px; right: 50px; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(15,30,61,0.7); border-radius: 50px; padding: 14px 24px;
    backdrop-filter: blur(4px);
  }
  .follow-bar .brand { font-size: 18px; color: #fff; font-family: "Microsoft YaHei", sans-serif; }
  .follow-bar .follow { font-size: 16px; color: #00ffc8; font-family: "Microsoft YaHei", sans-serif; font-weight: bold; }
</style>
</head>
<body>
  <div class="cover">
    <img class="bg-img" src="file:///D:/写作工具/知识管理/01-Projects-项目/OPC指挥部/九思对外输出/06-设计源文件/xhs3-person.png" alt="bg">

    <div class="top-tag">
      <div class="jiu">九</div>
      <div class="name">九思OS</div>
    </div>

    <div class="title-area">
      <div class="badge">🎯 认知升级</div>
      <div class="title">学了那么多AI技巧<br>为什么<font color="#00ffc8">还是用不好</font>？</div>
      <div class="sub">你缺的不是技巧，是方法</div>
    </div>

    <div class="follow-bar">
      <div class="brand">九思OS · 会进化的智生体</div>
      <div class="follow">关注 → 每天一个AI认知</div>
    </div>
  </div>
</body>
</html>
