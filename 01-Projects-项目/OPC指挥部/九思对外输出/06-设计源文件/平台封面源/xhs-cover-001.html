<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f5f5f5; }
  .cover {
    width: 1242px; height: 1660px;
    background: linear-gradient(180deg, #0f1e3d 0%, #1a2f5e 50%, #2a4a8f 85%, #d84a8a 100%);
    position: relative; overflow: hidden;
  }
  /* 背景光点 */
  .dot { position: absolute; border-radius: 50%; background: rgba(0,255,200,0.2); }
  .d1 { width: 40px; height: 40px; top: 15%; right: 12%; }
  .d2 { width: 22px; height: 22px; top: 25%; left: 10%; background: rgba(0,255,200,0.35); }
  .d3 { width: 30px; height: 30px; bottom: 30%; right: 20%; }
  .d4 { width: 14px; height: 14px; bottom: 40%; left: 15%; background: rgba(255,255,255,0.3); }

  /* 顶部品牌 */
  .top-tag {
    position: absolute; top: 60px; left: 60px;
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.12); border: 1.5px solid rgba(255,255,255,0.3);
    border-radius: 50px; padding: 12px 24px; z-index: 10;
  }
  .top-tag .jiu { width: 40px; height: 40px; background: rgba(255,255,255,0.15); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; color: #fff; }
  .top-tag .name { font-size: 20px; color: rgba(255,255,255,0.9); font-weight: bold; letter-spacing: 2px; font-family: "Microsoft YaHei", sans-serif; }

  /* 标题区（人物上方，占25-40%） */
  .title-area {
    position: absolute; top: 120px; left: 60px; right: 60px; z-index: 10;
    text-align: left;
  }
  .badge {
    display: inline-block; background: #e94560; color: #fff;
    font-size: 22px; font-weight: bold; padding: 8px 20px; border-radius: 10px;
    font-family: "Microsoft YaHei", sans-serif; margin-bottom: 25px;
    box-shadow: 0 4px 15px rgba(233,69,96,0.4);
  }
  .title {
    font-size: 80px; color: #fff; font-weight: 900; line-height: 1.3;
    font-family: "Microsoft YaHei", sans-serif;
    text-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  .title .hl { color: #00ffc8; }
  .sub-title {
    margin-top: 25px; font-size: 32px; color: rgba(255,255,255,0.9);
    font-family: "Microsoft YaHei", sans-serif; font-weight: 500;
    border-left: 6px solid #00ffc8; padding-left: 20px;
  }

  /* 人物区（占画面45-70%） */
  .person-area {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: center;
  }
  .person-img {
    width: 80%; max-width: 900px;
    filter: drop-shadow(0 -20px 40px rgba(0,0,0,0.3));
    border-radius: 40px 40px 0 0;
  }

  /* 底部关注 */
  .follow-bar {
    position: absolute; bottom: 40px; left: 60px; right: 60px; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid rgba(255,255,255,0.25); padding-top: 18px;
  }
  .follow-bar .brand { font-size: 18px; color: rgba(255,255,255,0.8); font-family: "Microsoft YaHei", sans-serif; }
  .follow-bar .follow { font-size: 16px; color: #00ffc8; font-family: "Microsoft YaHei", sans-serif; font-weight: bold; }
</style>
</head>
<body>
  <div class="cover">
    <div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div><div class="dot d4"></div>

    <div class="top-tag">
      <div class="jiu">九</div>
      <div class="name">九思OS · 会进化的智生体</div>
    </div>

    <div class="title-area">
      <div class="badge">🔥 全网热点</div>
      <div class="title">DeepSeek<br>为什么<font color="#00ffc8">突然火了</font>？</div>
      <div class="sub-title">普通人到底该怎么用？</div>
    </div>

    <div class="person-area">
      <img class="person-img" src="file:///D:/写作工具/知识管理/01-Projects-项目/OPC指挥部/九思对外输出/06-设计源文件/person-tutor.png" alt="person">
    </div>

    <div class="follow-bar">
      <div class="brand">九思OS</div>
      <div class="follow">关注 → 每天一个AI认知</div>
    </div>
  </div>
</body>
</html>
