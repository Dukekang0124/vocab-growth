<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f5f5f5; }
  .cover { width: 690px; height: 280px; position: relative; overflow: hidden; background: linear-gradient(120deg, #0f1e3d 0%, #1a2f5e 55%, #2a4a8f 80%, #d84a8a 100%); }

  .dot { position: absolute; border-radius: 50%; background: rgba(0,255,200,0.2); }
  .d1 { width: 60px; height: 60px; right: 10%; top: 15%; }
  .d2 { width: 25px; height: 25px; left: 20%; top: 20%; background: rgba(0,255,200,0.35); }
  .d3 { width: 40px; height: 40px; right: 25%; bottom: 10%; }
  .d4 { width: 15px; height: 15px; left: 15%; bottom: 25%; background: rgba(255,255,255,0.3); }

  .content { position: relative; z-index: 10; padding: 35px 40px; height: 100%; display: flex; flex-direction: column; justify-content: center; }
  .badge {
    display: inline-block; background: #00ffc8; color: #0f1e3d;
    font-size: 14px; font-weight: 900; padding: 4px 12px; border-radius: 6px;
    font-family: "Microsoft YaHei", sans-serif; margin-bottom: 12px; align-self: flex-start;
  }
  .title {
    font-size: 34px; color: #fff; font-weight: 900; line-height: 1.3;
    font-family: "Microsoft YaHei", sans-serif; text-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  .title .hl { color: #00ffc8; }
  .sub {
    margin-top: 8px; font-size: 15px; color: rgba(255,255,255,0.85);
    font-family: "Microsoft YaHei", sans-serif; font-weight: 500;
  }
  .brand {
    position: absolute; bottom: 12px; right: 20px; z-index: 10;
    font-size: 12px; color: rgba(255,255,255,0.6);
    font-family: "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; gap: 6px;
  }
  .brand .jiu { width: 20px; height: 20px; background: rgba(255,255,255,0.15); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #00ffc8; }
</style>
</head>
<body>
  <div class="cover">
    <div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div><div class="dot d4"></div>

    <div class="content">
      <div class="badge">🎯 认知升级</div>
      <div class="title">学了那么多AI技巧，为什么<font color="#00ffc8">还是用不好</font>？</div>
      <div class="sub">你缺的不是技巧，是方法——九思OS深度拆解</div>
    </div>

    <div class="brand">
      <div class="jiu">九</div>
      <span>九思OS · 会进化的智生体</span>
    </div>
  </div>
</body>
</html>
