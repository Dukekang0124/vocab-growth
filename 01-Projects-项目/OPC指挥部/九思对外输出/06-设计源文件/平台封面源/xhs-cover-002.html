<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f5f5f5; }
  .cover { width: 1242px; height: 1660px; position: relative; overflow: hidden; }
  .bg-img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .top-tag {
    position: absolute; top: 50px; left: 50px; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    background: rgba(15,30,61,0.85); border: 2px solid rgba(255,255,255,0.4);
    border-radius: 50px; padding: 12px 24px; backdrop-filter: blur(4px);
  }
  .top-tag .jiu { width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; color: #fff; }
  .top-tag .name { font-size: 20px; color: #fff; font-weight: bold; letter-spacing: 2px; font-family: "Microsoft YaHei", sans-serif; }

  .badge {
    position: absolute; top: 50px; right: 50px; z-index: 10;
    background: #e94560; border-radius: 10px; padding: 10px 18px;
    font-size: 18px; color: #fff; font-weight: bold;
    font-family: "Microsoft YaHei", sans-serif; box-shadow: 0 4px 15px rgba(233,69,96,0.5);
  }

  .title-overlay {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
    background: linear-gradient(180deg, rgba(15,30,61,0) 0%, rgba(15,30,61,0.7) 25%, rgba(15,30,61,0.96) 55%, rgba(15,30,61,1) 100%);
    padding: 180px 50px 50px;
  }
  .badge-sm {
    display: inline-block; background: #00ffc8; color: #0f1e3d;
    font-size: 20px; font-weight: bold; padding: 8px 18px; border-radius: 8px;
    font-family: "Microsoft YaHei", sans-serif; margin-bottom: 18px;
  }
  .title {
    font-size: 68px; color: #fff; font-weight: 900; line-height: 1.3;
    font-family: "Microsoft YaHei", sans-serif; text-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .title .hl { color: #00ffc8; }
  .sub {
    margin-top: 20px; font-size: 30px; color: rgba(255,255,255,0.95);
    font-family: "Microsoft YaHei", sans-serif; font-weight: 500;
  }
  .follow {
    margin-top: 25px; font-size: 20px; color: rgba(255,255,255,0.7);
    font-family: "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; gap: 10px;
  }
  .follow .arrow { color: #00ffc8; }
</style>
</head>
<body>
  <div class="cover">
    <img class="bg-img" src="file:///D:/写作工具/知识管理/01-Projects-项目/OPC指挥部/九思对外输出/06-设计源文件/xhs2-person.png" alt="bg">

    <div class="top-tag">
      <div class="jiu">九</div>
      <div class="name">九思OS · 会进化的智生体</div>
    </div>
    <div class="badge">💡 AI实用技巧</div>

    <div class="title-overlay">
      <div class="badge-sm">问AI万能公式</div>
      <div class="title">怎么问AI才能<br>得到<font color="#00ffc8">好答案</font>？</div>
      <div class="sub">问AI的万能公式，看完就会</div>
      <div class="follow">关注 <span class="arrow">→</span> 每天一个AI认知</div>
    </div>
  </div>
</body>
</html>
