<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0a0a12; }
  .cover { width: 1242px; height: 1660px; position: relative; overflow: hidden; background: #070d1f; }

  /* Seedream场景图作背景 */
  .bg-scene {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    z-index: 2;
  }
  /* 顶部渐变压暗（标题区）*/
  .top-fade {
    position: absolute; top: 0; left: 0; right: 0; height: 42%; z-index: 3;
    background: linear-gradient(180deg, rgba(7,13,31,0.95) 0%, rgba(7,13,31,0.7) 40%, transparent 100%);
  }
  .bottom-fade {
    position: absolute; bottom: 0; left: 0; right: 0; height: 15%; z-index: 3;
    background: linear-gradient(0deg, rgba(7,13,31,0.9) 0%, transparent 100%);
  }

  .deco { position: absolute; z-index: 4; }
  .hud-dot { width: 12px; height: 12px; background: rgba(0,255,200,0.9); border-radius: 50%; top: 8%; right: 8%; box-shadow: 0 0 25px rgba(0,255,200,1); }
  .hud-circle { width: 90px; height: 90px; border: 2px solid rgba(0,255,200,0.5); border-radius: 50%; top: 15%; left: 8%; }

  .top-tag {
    position: absolute; top: 45px; left: 45px; z-index: 10;
    display: flex; align-items: center; gap: 10px;
    background: rgba(0,255,200,0.08); border: 1.5px solid rgba(0,255,200,0.35);
    border-radius: 50px; padding: 12px 22px; backdrop-filter: blur(6px);
  }
  .top-tag .jiu { width: 36px; height: 36px; background: rgba(0,255,200,0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; color: #00ffc8; }
  .top-tag .name { font-size: 18px; color: rgba(255,255,255,0.95); font-weight: bold; letter-spacing: 2px; font-family: "Microsoft YaHei", sans-serif; }

  .title-area {
    position: absolute; top: 130px; left: 45px; right: 45px; z-index: 10;
  }
  .badge {
    display: inline-block; background: linear-gradient(90deg, #e94560, #ff6b81); color: #fff;
    font-size: 24px; font-weight: 900; padding: 12px 26px; border-radius: 10px;
    font-family: "Microsoft YaHei", sans-serif; margin-bottom: 22px;
    box-shadow: 0 4px 25px rgba(233,69,96,0.5); transform: rotate(-2deg);
  }
  .title {
    font-size: 84px; color: #fff; font-weight: 900; line-height: 1.25;
    font-family: "Microsoft YaHei", sans-serif;
    text-shadow: 0 6px 40px rgba(0,0,0,0.9);
  }
  .title .hl { color: #00ffc8; text-shadow: 0 0 30px rgba(0,255,200,0.5); }
  .sub {
    margin-top: 24px; font-size: 36px; color: rgba(255,255,255,0.95); font-weight: 700;
    font-family: "Microsoft YaHei", sans-serif;
    border-left: 6px solid #00ffc8; padding-left: 18px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.8);
  }

  .follow-bar {
    position: absolute; bottom: 30px; left: 45px; right: 45px; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(0,255,200,0.06); border: 1px solid rgba(0,255,200,0.25);
    border-radius: 50px; padding: 16px 24px; backdrop-filter: blur(8px);
  }
  .follow-bar .brand { font-size: 17px; color: rgba(255,255,255,0.85); font-family: "Microsoft YaHei", sans-serif; }
  .follow-bar .follow { font-size: 16px; color: #00ffc8; font-family: "Microsoft YaHei", sans-serif; font-weight: bold; }
</style>
</head>
<body>
  <div class="cover">
    <img class="bg-scene" src="file:///D:/写作工具/知识管理/01-Projects-项目/OPC指挥部/九思对外输出/06-设计源文件/seedream-005-2k.png" alt="scene">
    <div class="top-fade"></div>
    <div class="bottom-fade"></div>
    <div class="deco hud-dot"></div>
    <div class="deco hud-circle"></div>

    <div class="top-tag">
      <div class="jiu">九</div>
      <div class="name">九思OS</div>
    </div>

    <div class="title-area">
      <div class="badge">⚡ 行动派</div>
      <div class="title">别等学会了再动手<br><span class="hl">先做起来</span><br>AI会教你</div>
      <div class="sub">你缺的不是技巧，是开始</div>
    </div>

    <div class="follow-bar">
      <div class="brand">九思OS · 会进化的智生体</div>
      <div class="follow">关注 → 每天一个AI认知</div>
    </div>
  </div>
</body>
</html>
