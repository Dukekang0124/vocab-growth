<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0a0a12; }
  .cover { width: 690px; height: 280px; position: relative; overflow: hidden; background: #070d1f; }

  /* Seedream场景图作背景 */
  .bg-scene {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    z-index: 2;
  }
  /* 右侧渐变（标题区）*/
  .right-fade {
    position: absolute; top: 0; right: 0; bottom: 0; width: 52%; z-index: 3;
    background: linear-gradient(270deg, rgba(7,13,31,0.96) 0%, rgba(7,13,31,0.75) 55%, transparent 100%);
  }

  .deco { position: absolute; z-index: 4; }
  .hud-dot { width: 6px; height: 6px; background: rgba(0,255,200,0.9); border-radius: 50%; top: 15%; right: 32%; box-shadow: 0 0 12px rgba(0,255,200,1); }

  .content { position: absolute; right: 0; top: 0; bottom: 0; z-index: 10; width: 52%; padding: 20px 22px; display: flex; flex-direction: column; justify-content: center; }
  .badge {
    display: inline-block; background: linear-gradient(90deg, #e94560, #ff6b81); color: #fff;
    font-size: 11px; font-weight: 900; padding: 4px 10px; border-radius: 5px;
    font-family: "Microsoft YaHei", sans-serif; margin-bottom: 8px; align-self: flex-start;
  }
  .title {
    font-size: 22px; color: #fff; font-weight: 900; line-height: 1.35;
    font-family: "Microsoft YaHei", sans-serif;
    text-shadow: 0 3px 15px rgba(0,0,0,0.9);
  }
  .title .hl { color: #00ffc8; text-shadow: 0 0 15px rgba(0,255,200,0.5); }
  .sub {
    margin-top: 6px; font-size: 12px; color: rgba(255,255,255,0.9); font-weight: 700;
    font-family: "Microsoft YaHei", sans-serif;
    border-left: 3px solid #00ffc8; padding-left: 8px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }
  .brand {
    position: absolute; bottom: 10px; right: 22px; z-index: 10;
    font-size: 10px; color: rgba(255,255,255,0.7);
    font-family: "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; gap: 4px;
  }
  .brand .jiu { width: 15px; height: 15px; background: rgba(0,255,200,0.25); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 900; color: #00ffc8; }
</style>
</head>
<body>
  <div class="cover">
    <img class="bg-scene" src="file:///D:/写作工具/知识管理/01-Projects-项目/OPC指挥部/九思对外输出/06-设计源文件/seedream-005-2k.png" alt="scene">
    <div class="right-fade"></div>
    <div class="deco hud-dot"></div>

    <div class="content">
      <div class="badge">⚡ 行动派</div>
      <div class="title">别等学会了再动手<br><span class="hl">先做起来</span>，AI会教你</div>
      <div class="sub">你缺的不是技巧，是开始</div>
    </div>

    <div class="brand">
      <div class="jiu">九</div>
      <span>九思OS</span>
    </div>
  </div>
</body>
</html>
