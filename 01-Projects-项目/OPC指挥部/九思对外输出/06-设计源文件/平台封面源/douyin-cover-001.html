<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #fff; }
  .cover {
    width: 900px; height: 1200px;
    background: linear-gradient(160deg, #0f1e3d 0%, #1a2f5e 45%, #2a4a8f 70%, #d84a8a 100%);
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; padding: 70px 60px;
  }
  /* 光点（品牌元素） */
  .dot { position: absolute; border-radius: 50%; background: rgba(0, 255, 200, 0.25); filter: blur(1px); }
  .d1 { width: 30px; height: 30px; top: 12%; right: 18%; }
  .d2 { width: 18px; height: 18px; top: 20%; left: 12%; background: rgba(0,255,200,0.4); }
  .d3 { width: 24px; height: 24px; bottom: 22%; right: 25%; }
  .d4 { width: 12px; height: 12px; bottom: 30%; left: 15%; background: rgba(255,255,255,0.3); }

  .top-tag {
    position: absolute; top: 60px; left: 60px;
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.12); border: 1.5px solid rgba(255,255,255,0.3);
    border-radius: 50px; padding: 10px 20px;
  }
  .top-tag .jiu { width: 36px; height: 36px; background: rgba(255,255,255,0.15); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; color: #fff; }
  .top-tag .name { font-size: 18px; color: rgba(255,255,255,0.9); font-weight: bold; letter-spacing: 2px; font-family: "Microsoft YaHei", sans-serif; }

  .hot-badge {
    position: absolute; top: 60px; right: 60px;
    background: #e94560; border-radius: 10px; padding: 8px 16px;
    font-size: 16px; color: #fff; font-weight: bold; font-family: "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; gap: 6px;
    box-shadow: 0 4px 15px rgba(233,69,96,0.4);
  }

  .main { margin-top: 80px; }
  .q { font-size: 30px; color: rgba(255,255,255,0.7); font-weight: 300; font-family: "Microsoft YaHei", sans-serif; margin-bottom: 20px; }
  .title {
    font-size: 72px; color: #fff; font-weight: 900; line-height: 1.35;
    font-family: "Microsoft YaHei", sans-serif;
    text-shadow: 0 8px 30px rgba(0,0,0,0.3);
  }
  .title .hl { color: #00ffc8; }
  .sub {
    margin-top: 40px; font-size: 30px; color: rgba(255,255,255,0.85);
    font-family: "Microsoft YaHei", sans-serif; font-weight: 500;
    border-left: 6px solid #00ffc8; padding-left: 20px; line-height: 1.6;
  }

  .bottom {
    position: absolute; bottom: 50px; left: 60px; right: 60px;
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid rgba(255,255,255,0.2); padding-top: 20px;
  }
  .bottom .left { display: flex; align-items: center; gap: 10px; }
  .bottom .avatar { width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; color: #00ffc8; }
  .bottom .brand { font-size: 18px; color: rgba(255,255,255,0.7); font-family: "Microsoft YaHei", sans-serif; }
  .bottom .follow { font-size: 16px; color: rgba(255,255,255,0.5); font-family: "Microsoft YaHei", sans-serif; }
</style>
</head>
<body>
  <div class="cover">
    <div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div><div class="dot d4"></div>

    <div class="top-tag">
      <div class="jiu">九</div>
      <div class="name">九思OS</div>
    </div>
    <div class="hot-badge">🔥 全网热点</div>

    <div class="main">
      <div class="q">DeepSeek为什么突然火了？</div>
      <div class="title">普通人<br>到底<font color="#00ffc8">该怎么用？</font></div>
      <div class="sub">AI暴涨之前<br>先看懂怎么用起来</div>
    </div>

    <div class="bottom">
      <div class="left">
        <div class="avatar">九</div>
        <div class="brand">九思OS · 会进化的智生体</div>
      </div>
      <div class="follow">关注 → 每天一个AI认知</div>
    </div>
  </div>
</body>
</html>
