<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语学习课程报价配置器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #f0fdf4, #eff6ff);
    min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
    padding: 20px;
  }
  .container {
    width: 100%; max-width: 900px;
    background: #fff;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
  }
  h1 {
    font-size: 24px; color: #1f2937; text-align: center;
    margin-bottom: 8px;
  }
  .sub {
    text-align: center; color: #6b7280; font-size: 14px;
    margin-bottom: 30px;
  }

  /* 参数区 */
  .params { display: flex; flex-direction: column; gap: 24px; margin-bottom: 30px; }
  .param-row { display: flex; align-items: center; gap: 16px; }
  .param-label { width: 120px; color: #374151; font-size: 14px; font-weight: 600; }
  .param-slider { flex: 1; }
  .param-value {
    width: 80px; text-align: right; color: #0f3460;
    font-size: 16px; font-weight: 700;
  }
  input[type="range"] {
    width: 100%; height: 6px; -webkit-appearance: none;
    background: #e5e7eb; border-radius: 3px; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px;
    border-radius: 50%; background: #0f3460; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  /* 套餐卡片 */
  .plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 30px; }
  .plan {
    border: 2px solid #e5e7eb; border-radius: 16px; padding: 20px;
    text-align: center; position: relative; transition: all 0.2s;
  }
  .plan.popular { border-color: #0f3460; background: #f8fafc; }
  .plan .badge {
    position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
    background: #e94560; color: #fff; font-size: 11px; font-weight: 700;
    padding: 3px 12px; border-radius: 10px;
  }
  .plan-name { font-size: 16px; font-weight: 700; color: #1f2937; margin-bottom: 8px; }
  .plan-price { font-size: 28px; font-weight: 900; color: #0f3460; margin-bottom: 6px; }
  .plan-price span { font-size: 14px; font-weight: 400; color: #6b7280; }
  .plan-desc { font-size: 12px; color: #6b7280; line-height: 1.6; }

  /* 结果区 */
  .result {
    background: #0f3460; border-radius: 16px; padding: 24px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .result-label { color: rgba(255,255,255,0.7); font-size: 13px; margin-bottom: 4px; }
  .result-total { color: #fff; font-size: 36px; font-weight: 900; }
  .result-total span { font-size: 16px; font-weight: 400; }
  .result-save { text-align: right; }
  .save-num { color: #4ecdc4; font-size: 20px; font-weight: 700; }
  .save-label { color: rgba(255,255,255,0.6); font-size: 12px; }
</style>
</head>
<body>
<div class="container">
  <h1>英语学习课程报价配置器</h1>
  <div class="sub">拖动参数，实时生成你的定制方案</div>

  <div class="params">
    <div class="param-row">
      <div class="param-label">学习人数</div>
      <div class="param-slider"><input type="range" id="learners" min="1" max="10" value="1"></div>
      <div class="param-value" id="learnersV">1 人</div>
    </div>
    <div class="param-row">
      <div class="param-label">学习时长</div>
      <div class="param-slider"><input type="range" id="months" min="1" max="12" value="3"></div>
      <div class="param-value" id="monthsV">3 个月</div>
    </div>
    <div class="param-row">
      <div class="param-label">陪练次数/周</div>
      <div class="param-slider"><input type="range" id="sessions" min="0" max="7" value="2"></div>
      <div class="param-value" id="sessionsV">2 次</div>
    </div>
  </div>

  <div class="plans">
    <div class="plan">
      <div class="plan-name">入门版</div>
      <div class="plan-price" id="p1">¥9.9<span>/人</span></div>
      <div class="plan-desc">零基础起步<br>音标+拼读入门<br>学习路线图</div>
    </div>
    <div class="plan popular">
      <div class="badge">🔥 推荐</div>
      <div class="plan-name">进阶版</div>
      <div class="plan-price" id="p2">¥97<span>/人</span></div>
      <div class="plan-desc">四阶段体系<br>方法纠偏+陪练<br>学习监督</div>
    </div>
    <div class="plan">
      <div class="plan-name">私教版</div>
      <div class="plan-price" id="p3">¥297<span>/人</span></div>
      <div class="plan-desc">1对1私教<br>定制学习计划<br>全程陪跑</div>
    </div>
  </div>

  <div class="result">
    <div>
      <div class="result-label">你的定制总价（进阶版）</div>
      <div class="result-total" id="total">¥291<span> / 3个月</span></div>
    </div>
    <div class="result-save">
      <div class="save-num" id="save">省 ¥0</div>
      <div class="save-label">多人团购已优惠</div>
    </div>
  </div>
</div>

<script>
  const learners = document.getElementById('learners');
  const months = document.getElementById('months');
  const sessions = document.getElementById('sessions');
  const learnersV = document.getElementById('learnersV');
  const monthsV = document.getElementById('monthsV');
  const sessionsV = document.getElementById('sessionsV');
  const p1 = document.getElementById('p1');
  const p2 = document.getElementById('p2');
  const p3 = document.getElementById('p3');
  const total = document.getElementById('total');
  const save = document.getElementById('save');

  // 阶梯价（人数越多单价越低）
  function unitPrice(n) {
    if (n >= 5) return 79;   // 5人以上
    if (n >= 3) return 89;   // 3-4人
    return 97;               // 1-2人
  }

  function calc() {
    const n = parseInt(learners.value);
    const m = parseInt(months.value);
    const s = parseInt(sessions.value);
    learnersV.textContent = n + ' 人';
    monthsV.textContent = m + ' 个月';
    sessionsV.textContent = s + ' 次';

    // 套餐单价（随人数阶梯）
    const p1p = 9.9, p3p = 297;
    const p2p = unitPrice(n);
    p1.innerHTML = '¥' + p1p.toFixed(1) + '<span>/人</span>';
    p2.innerHTML = '¥' + p2p + '<span>/人</span>';
    p3.innerHTML = '¥' + p3p + '<span>/人</span>';

    // 总价：进阶版单价×人数×时长
    const baseTotal = p2p * n * m;
    // 时长优惠（≥6个月 9折）
    const discount = m >= 6 ? 0.9 : 1;
    const finalTotal = Math.round(baseTotal * discount);
    total.innerHTML = '¥' + finalTotal + '<span> / ' + m + '个月</span>';

    // 节省（对比原价97×n×m）
    const original = 97 * n * m;
    const saved = Math.max(0, original - finalTotal);
    save.textContent = '省 ¥' + saved;
  }

  learners.oninput = calc;
  months.oninput = calc;
  sessions.oninput = calc;
  calc();
</script>
</body>
</html>
