<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px; 
  background: linear-gradient(170deg, #fef9f0 0%, #fdf5e8 50%, #fef8f3 100%);
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  color: #2d1f0e;
  
}
.accent {
  height: 6px; flex-shrink: 0;
  background: linear-gradient(90deg, #e8a850, #f0c070, #e8c890);
}
.container {
   
  padding: 56px 72px 32px;
  
}
.tag { display: block; text-align: center; margin-left: auto; margin-right: auto; 
  display: inline-block;
  background: #fdf0dc; color: #b8752e;
  font-size: 24px; font-weight: 700;
  padding: 10px 28px; border-radius: 40px;
  letter-spacing: 4px; margin-bottom: 36px;
}
.title { text-align: center; 
  font-size: 82px; font-weight: 900; line-height: 1.12;
  margin-bottom: 16px; color: #1a1005;
}
.highlight { color: #c07830; }
.footer {
  text-align: center; padding-top: 32px;
  border-top: 2px solid #e8dcc8;
}
.footer-text { font-size: 28px; color: #8b7355; letter-spacing: 2px; }
.footer-arrow { color: #c07830; margin: 0 8px; display: inline-block; }


.sub { text-align: center;  text-align: center;  font-size: 30px; color: #b8a088; margin-bottom: 44px; line-height: 1.5; }
.pain {  gap: 14px; margin-bottom: 44px; }
.pain-item {
  padding: 24px 36px; border-radius: 18px;
  background: #faf6ed; border: 1px solid #e8dcc8;
  font-size: 28px; color: #6b5a40; line-height: 1.6;
}
.pain-item b { color: #c07830; }
.pivot {
  padding: 38px 42px; border-radius: 22px;
  background: #fdf5e0; border: 1px solid #e8d0a0;
  font-size: 28px; line-height: 1.8; color: #4a3020;
}
.pivot .big { font-size: 32px; font-weight: 700; color: #2d1f0e; display: block; margin-bottom: 10px; }

</style>
</head>
<body>

<div class="accent"></div>
<div class="tag">苏不倦 · 英语学习</div>
<div class="title">零基础学英语<br><span class="highlight">最怕什么？</span></div>
<div class="sub">不是学不会。是一上来就走错路，然后放弃。</div>

<div class="pain">
<div class="pain-item">网上搜攻略：<b>先背单词、学语法、看美剧</b>——越看越乱，越学越慌。硬撑几个月，直接放弃。</div>
<div class="pain-item">下次看到别人流利英语，又觉得自己行——<b>再来一轮，还是放弃。</b></div>
</div>

<div class="pivot">
<span class="big">问题不是你懒。</span>
是那些方法根本不适合零基础。
<br><br>
我高考英语刚及格，从零自己摸索过来。
现在能用英语跟老外聊天、拍英语视频。
<br><br>
我把踩过的坑整理成了一份路线图：
<b>每天25分钟，4-8周看到变化。</b>
</div>

<div class="footer"><span class="footer-text">进<span class="footer-arrow">→</span>粉丝群<span class="footer-arrow">→</span>领完整版《从零到入门》PDF</span></div>

</body>
</html>
