<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px; 
  background: linear-gradient(170deg, #fef9f0 0%, #fdf5e8 50%, #fef8f3 100%);
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  color: #2d1f0e;
  
}
.accent {
  height: 6px; flex-shrink: 0;
  background: linear-gradient(90deg, #e8a850, #f0c070, #e8c890);
}
.container {
   
  padding: 56px 72px 32px;
  
}
.tag { display: block; text-align: center; margin-left: auto; margin-right: auto; 
  display: inline-block;
  background: #fdf0dc; color: #b8752e;
  font-size: 24px; font-weight: 700;
  padding: 10px 28px; border-radius: 40px;
  letter-spacing: 4px; margin-bottom: 36px;
}
.title { text-align: center; 
  font-size: 82px; font-weight: 900; line-height: 1.12;
  margin-bottom: 16px; color: #1a1005;
}
.sub { text-align: center; font-size: 34px; color: #b8a088; margin-bottom: 48px; font-weight: 400; }
.highlight { color: #c07830; }
.footer {
  text-align: center; padding-top: 32px;
  border-top: 2px solid #e8dcc8;
}
.footer-text { font-size: 28px; color: #8b7355; letter-spacing: 2px; }
.footer-arrow { color: #c07830; margin: 0 8px; display: inline-block; }


.content { margin-top: 16px;  gap: 14px; }
.stage {
  padding: 30px 40px; border-radius: 22px;
  background: #faf6ed; border: 1px solid #e8dcc8;
}
.stage-header { display: flex;  align-items: baseline; margin-bottom: 8px; }
.stage-week { font-size: 24px; font-weight: 700; color: #c07830; }
.stage-time { font-size: 24px; color: #b8a088; }
.stage-name { font-size: 30px; font-weight: 700; color: #2d1f0e; margin-bottom: 6px; }
.stage-desc { font-size: 24px; color: #8b7355; line-height: 1.5; }
.method {
  padding: 34px 40px; border-radius: 22px;
  background: #fdf5e0; border: 1px solid #e8d0a0;
  font-size: 26px; line-height: 1.8; color: #5a4020;
}
.method b { color: #c07830; }
.method .steps { font-size: 24px; color: #7a6030; margin-top: 6px; line-height: 1.6; }

</style>
</head>
<body>

<div class="accent"></div>
<div class="tag">苏不倦 · 英语学习</div>
<div class="title">零基础听力<br><span class="highlight">8周排期</span></div>
<div class="sub">不花钱，免费材料</div>
<div class="content">
<div class="stage">
  <div class="stage-header"><span class="stage-week">第 1-2 周</span><span class="stage-time">每天 15分钟</span></div>
  <div class="stage-name">Extra English 零基础情景剧</div>
  <div class="stage-desc">极慢语速、极简单词、画面帮你理解</div>
</div>
<div class="stage">
  <div class="stage-header"><span class="stage-week">第 3-4 周</span><span class="stage-time">每天 15分钟</span></div>
  <div class="stage-name">英语启蒙动画</div>
  <div class="stage-desc">画面和声音同步，跟看动画片一样轻松</div>
</div>
<div class="stage">
  <div class="stage-header"><span class="stage-week">第 5-8 周</span><span class="stage-time">每天 20分钟</span></div>
  <div class="stage-name">赖世雄美语入门</div>
  <div class="stage-desc">慢速中文讲解 + 英文朗读，专为零基础设计</div>
</div>
</div>
<div class="method">
<b>怎么听：</b>
<div class="steps">① 先看画面 → ② 关掉只听 → ③ 听一句暂停跟读一句 → ④ 同一集反复3-5遍</div>
<br><b>一集听透，比刷十集有用。</b>
</div>
<div class="footer"><span class="footer-text">进<span class="footer-arrow">→</span>粉丝群<span class="footer-arrow">→</span>领完整版《从零到入门》PDF</span></div>

</body>
</html>
