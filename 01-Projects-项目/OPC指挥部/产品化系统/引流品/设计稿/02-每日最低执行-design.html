<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px; 
  background: linear-gradient(170deg, #fef9f0 0%, #fdf5e8 50%, #fef8f3 100%);
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  color: #2d1f0e;
  
}
.accent {
  height: 6px; flex-shrink: 0;
  background: linear-gradient(90deg, #e8a850, #f0c070, #e8c890);
}
.container {
   
  padding: 56px 72px 32px;
  
}
.tag { display: block; text-align: center; margin-left: auto; margin-right: auto; 
  display: inline-block;
  background: #fdf0dc; color: #b8752e;
  font-size: 24px; font-weight: 700;
  padding: 10px 28px; border-radius: 40px;
  letter-spacing: 4px; margin-bottom: 36px;
}
.title { text-align: center; 
  font-size: 82px; font-weight: 900; line-height: 1.12;
  margin-bottom: 16px; color: #1a1005;
}
.sub { text-align: center; font-size: 34px; color: #b8a088; margin-bottom: 48px; font-weight: 400; }
.highlight { color: #c07830; }
.footer {
  text-align: center; padding-top: 32px;
  border-top: 2px solid #e8dcc8;
}
.footer-text { font-size: 28px; color: #8b7355; letter-spacing: 2px; }
.footer-arrow { color: #c07830; margin: 0 8px; display: inline-block; }


.content { margin-top: 16px;  gap: 14px; }
.row {
  display: flex; align-items: center; gap: 14px;
  padding: 34px 40px; border-radius: 22px;
  background: #faf6ed; border: 1px solid #e8dcc8;
}
.emoji { font-size: 50px; flex-shrink: 0; }
.row-text {  }
.row-time { font-size: 28px; color: #8b7355; font-weight: 400; }
.row-title { font-size: 30px; font-weight: 700; color: #2d1f0e; margin-bottom: 4px; }
.row-desc { font-size: 24px; color: #8b7355; }
.note {
  padding: 34px 40px; border-radius: 22px;
  background: #fdf5e0; border: 1px solid #e8d0a0;
  font-size: 28px; line-height: 1.6; color: #5a4020;
}
.note b { color: #c07830; }

</style>
</head>
<body>

<div class="accent"></div>
<div class="tag">苏不倦 · 英语学习</div>
<div class="title">零基础<span class="highlight">每天怎么学</span></div>
<div class="sub">每天25分钟，拆成三段</div>
<div class="content">
<div class="row">
  <div class="emoji">☀️</div>
  <div class="row-text"><div class="row-title">早上</div><div class="row-desc">看英语动画或听赖世雄音频</div></div>
  <div class="row-time">15分钟</div>
</div>
<div class="row">
  <div class="emoji">🕐</div>
  <div class="row-text"><div class="row-title">碎片时间</div><div class="row-desc">多邻国刷1关</div></div>
  <div class="row-time">5分钟</div>
</div>
<div class="row">
  <div class="emoji">🌙</div>
  <div class="row-text"><div class="row-title">晚上</div><div class="row-desc">读英文儿童书1-2页</div></div>
  <div class="row-time">5分钟</div>
</div>
</div>
<div class="note"><b>底线低到状态最差的那天也能完成。</b>一旦开始了，往往就会继续做下去。不劝退，就是赢。</div>
<div class="footer"><span class="footer-text">进<span class="footer-arrow">→</span>粉丝群<span class="footer-arrow">→</span>领完整版《从零到入门》PDF</span></div>

</body>
</html>
