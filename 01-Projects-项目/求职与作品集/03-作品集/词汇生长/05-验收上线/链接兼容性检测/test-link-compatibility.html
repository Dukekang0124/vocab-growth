<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>词汇生长 · 链接兼容性检测工具</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .content {
      padding: 30px;
    }

    .section {
      margin-bottom: 40px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #333;
      border-left: 4px solid #667eea;
      padding-left: 12px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #555;
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px;
      font-size: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      transition: border-color 0.3s;
    }

    .input-group input:focus {
      outline: none;
      border-color: #667eea;
    }

    .input-group input::placeholder {
      color: #999;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .results {
      display: none;
    }

    .results.active {
      display: block;
    }

    .platform-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .platform-card {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 16px;
      border-left: 4px solid #ccc;
      transition: all 0.3s;
    }

    .platform-card.supported {
      border-left-color: #10b981;
      background: #ecfdf5;
    }

    .platform-card.unsupported {
      border-left-color: #ef4444;
      background: #fef2f2;
    }

    .platform-card.unknown {
      border-left-color: #f59e0b;
      background: #fffbeb;
    }

    .platform-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }

    .platform-status {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .platform-status.supported {
      color: #10b981;
    }

    .platform-status.unsupported {
      color: #ef4444;
    }

    .platform-status.unknown {
      color: #f59e0b;
    }

    .platform-reason {
      font-size: 13px;
      color: #666;
      margin-bottom: 12px;
    }

    .platform-notes {
      font-size: 12px;
      color: #888;
      background: white;
      padding: 8px;
      border-radius: 4px;
    }

    .platform-notes ul {
      padding-left: 16px;
    }

    .platform-notes li {
      margin-bottom: 4px;
    }

    .summary {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
    }

    .summary-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #333;
    }

    .summary-stats {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
    }

    .summary-stat {
      text-align: center;
    }

    .summary-stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #667eea;
    }

    .summary-stat-label {
      font-size: 12px;
      color: #666;
    }

    .summary-recommendations {
      border-top: 1px solid #e0e0e0;
      padding-top: 16px;
    }

    .recommendation-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
      padding: 12px;
      background: white;
      border-radius: 6px;
    }

    .recommendation-item.priority-high {
      border-left: 3px solid #ef4444;
    }

    .recommendation-item.priority-medium {
      border-left: 3px solid #f59e0b;
    }

    .recommendation-priority {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .recommendation-priority.high {
      background: #fef2f2;
      color: #ef4444;
    }

    .recommendation-priority.medium {
      background: #fffbeb;
      color: #f59e0b;
    }

    .recommendation-message {
      font-size: 13px;
      color: #333;
    }

    .recommendation-action {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 20px;
      color: #666;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #e0e0e0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .current-platform {
      background: #ecfdf5;
      border: 1px solid #10b981;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .current-platform-label {
      font-size: 13px;
      font-weight: 500;
      color: #059669;
      margin-bottom: 8px;
    }

    .current-platform-info {
      font-size: 14px;
      color: #065f46;
    }

    .copy-btn {
      background: #f0f0f0;
      color: #333;
      padding: 6px 12px;
      font-size: 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .copy-btn:hover {
      background: #e0e0e0;
    }

    .link-inputs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }

    .link-input {
      display: flex;
      gap: 8px;
    }

    .link-input input {
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔗 链接兼容性检测工具</h1>
      <p>检测产品链接在微信、抖音等主流平台的打开支持状态</p>
    </div>

    <div class="content">
      <!-- 当前平台检测 -->
      <div class="section">
        <div class="section-title">📍 当前运行环境</div>
        <div class="current-platform">
          <div class="current-platform-label">当前平台：</div>
          <div class="current-platform-info" id="currentPlatformInfo">
            <div class="loading">
              <div class="spinner"></div>
              <span>检测中...</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 链接输入 -->
      <div class="section">
        <div class="section-title">📝 输入产品链接</div>
        <div class="input-group">
          <label>产品链接（HTTPS 协议）</label>
          <input
            type="url"
            id="productLink"
            placeholder="https://yourname.github.io/vocab-growth-app/"
            value="https://yourname.github.io/vocab-growth-app/"
          >
        </div>
        <div class="link-inputs">
          <div class="link-input">
            <button class="btn btn-secondary" onclick="useTestLink()">
              🧪 使用测试链接
            </button>
            <button class="btn btn-secondary" onclick="useLocalhost()">
              🏠 本地测试链接
            </button>
          </div>
          <div class="link-input">
            <button class="btn btn-primary" onclick="checkCompatibility()">
              🔍 开始检测
            </button>
          </div>
        </div>
      </div>

      <!-- 加载状态 -->
      <div id="loading" class="loading" style="display: none;">
        <div class="spinner"></div>
        <span>检测中...</span>
      </div>

      <!-- 检测结果 -->
      <div id="results" class="results">
        <div class="section">
          <div class="section-title">📊 平台支持检测结果</div>
          <div class="platform-grid" id="platformGrid">
            <!-- 平台卡片会动态插入这里 -->
          </div>
        </div>

        <div class="section">
          <div class="section-title">📈 支持率总结</div>
          <div class="summary">
            <div class="summary-stats">
              <div class="summary-stat">
                <div class="summary-stat-value" id="totalPlatforms">7</div>
                <div class="summary-stat-label">总平台数</div>
              </div>
              <div class="summary-stat">
                <div class="summary-stat-value" id="supportedCount">0</div>
                <div class="summary-stat-label">支持平台</div>
              </div>
              <div class="summary-stat">
                <div class="summary-stat-value" id="supportRate">0%</div>
                <div class="summary-stat-label">支持率</div>
              </div>
            </div>

            <div class="summary-recommendations">
              <div class="summary-title">💡 改进建议</div>
              <div id="recommendationsList">
                <!-- 建议会动态插入这里 -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="link-compatibility-checker.js"></script>
  <script>
    // 初始化当前平台信息
    document.addEventListener('DOMContentLoaded', function() {
      const currentPlatform = LinkCompatibilityChecker.getCurrentPlatform();
      const platformInfo = document.getElementById('currentPlatformInfo');

      if (currentPlatform.isWechat) {
        platformInfo.innerHTML = `
          <strong>微信环境</strong> (${currentPlatform.name})<br>
          <button class="copy-btn" onclick="copyLink()">📋 复制链接</button>
        `;
      } else {
        platformInfo.innerHTML = `
          <strong>浏览器环境</strong> (${currentPlatform.name})<br>
          <button class="copy-btn" onclick="copyLink()">📋 复制链接</button>
        `;
      }
    });

    // 使用测试链接
    function useTestLink() {
      const testLink = LinkCompatibilityChecker.generateTestLink();
      document.getElementById('productLink').value = testLink;
    }

    // 使用本地测试链接
    function useLocalhost() {
      document.getElementById('productLink').value = 'http://127.0.0.1:8430/';
    }

    // 复制链接
    function copyLink() {
      const link = document.getElementById('productLink').value;
      navigator.clipboard.writeText(link).then(function() {
        alert('链接已复制到剪贴板！');
      }).catch(function(err) {
        alert('复制失败，请手动复制');
      });
    }

    // 检测兼容性
    function checkCompatibility() {
      const url = document.getElementById('productLink').value.trim();

      if (!url) {
        alert('请输入产品链接');
        return;
      }

      // 显示加载状态
      document.getElementById('loading').style.display = 'flex';
      document.getElementById('results').classList.remove('active');

      // 延迟执行，让 UI 有时间渲染加载状态
      setTimeout(function() {
        try {
          const results = LinkCompatibilityChecker.checkAllPlatforms(url);
          const summary = LinkCompatibilityChecker.getSupportSummary(url);

          // 渲染平台卡片
          renderPlatformCards(results);

          // 渲染总结
          renderSummary(summary);

          // 显示结果
          document.getElementById('loading').style.display = 'none';
          document.getElementById('results').classList.add('active');

        } catch (error) {
          alert('检测失败：' + error.message);
          document.getElementById('loading').style.display = 'none';
        }
      }, 500);
    }

    // 渲染平台卡片
    function renderPlatformCards(results) {
      const grid = document.getElementById('platformGrid');
      grid.innerHTML = '';

      results.forEach(function(result) {
        const card = document.createElement('div');
        card.className = 'platform-card ' + result.status;

        const statusText = result.supported ? '✅ 支持' : '❌ 不支持';
        const statusClass = result.supported ? 'supported' : 'unsupported';

        let notesHtml = '';
        if (result.notes && result.notes.length > 0) {
          notesHtml = '<div class="platform-notes"><ul>' +
            result.notes.map(function(note) {
              return '<li>' + note + '</li>';
            }).join('') +
            '</ul></div>';
        }

        card.innerHTML = `
          <div class="platform-name">${result.platformName}</div>
          <div class="platform-status ${statusClass}">${statusText}</div>
          <div class="platform-reason">${result.reason}</div>
          ${notesHtml}
        `;

        grid.appendChild(card);
      });
    }

    // 渲染总结
    function renderSummary(summary) {
      document.getElementById('totalPlatforms').textContent = summary.totalPlatforms;
      document.getElementById('supportedCount').textContent = summary.supportedPlatforms.length;
      document.getElementById('supportRate').textContent = summary.supportRate + '%';

      const recommendationsList = document.getElementById('recommendationsList');
      recommendationsList.innerHTML = '';

      if (summary.recommendations.length === 0) {
        recommendationsList.innerHTML = '<div style="color: #10b981; font-size: 13px;">✅ 所有平台已支持，无需改进！</div>';
      } else {
        summary.recommendations.forEach(function(rec) {
          const item = document.createElement('div');
          item.className = 'recommendation-item priority-' + rec.priority;

          item.innerHTML = `
            <div class="recommendation-priority ${rec.priority}">${rec.priority.toUpperCase()}</div>
            <div>
              <div class="recommendation-message">${rec.message}</div>
              <div class="recommendation-action">👉 ${rec.action}</div>
            </div>
          `;

          recommendationsList.appendChild(item);
        });
      }
    }
  </script>
</body>
</html>
